<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔塔操盘手 · 白盒 Demo v0.6.3</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#222; --muted:#777; --line:#e3e1dc; --accent:#2f6fde; --good:#1e8a4c; --bad:#c43c3c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .header { position: sticky; top: 0; z-index: 5; }
  .header .big { font-size: 18px; font-weight: 600; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:6px; }
  .stats b { font-size: 16px; }
  .odds b { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.sel { background: #eef3fd; }
  tbody tr { cursor: default; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; margin-left:6px; border-radius:10px; background:#f1e6c8; color:#7a5a00; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); background: #fafafa; border-radius: 6px; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 7px 18px; margin-top: 10px; }
  select, input[type=number] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
  input[type=number] { width: 110px; }
  .seed { display:block; margin: 8px 0; }
  .lineup, .bet { display:flex; flex-wrap:wrap; gap: 10px 18px; align-items:center; margin: 4px 0; }
  .lineup label, .bet label { display:flex; gap:6px; align-items:center; }
  .field { display:flex; align-items:center; gap: 12px; flex-wrap: wrap; }
  .side { flex: 1 1 360px; }
  .row { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
  .row.rev { flex-direction: row-reverse; justify-content: flex-end; }
  .vs { font-weight: 700; color: var(--muted); }
  .unit { border:1px solid var(--line); border-radius:6px; padding:6px 8px; width: 120px; }
  .unit.out { opacity: .45; }
  .hpbar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .hpbar div { height: 100%; background: var(--good); transition: width .2s; }
  .controls { margin: 10px 0; display:flex; gap:8px; }
  .log { max-height: 260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fcfcfb; font-size: 13px; }
  .ev.crit { color: #b65d00; font-weight: 600; }
  .ev.dodge, .ev.miss, .ev.stun { color: var(--muted); }
  .ev.death { color: var(--bad); font-weight: 600; }
  .ev.flee { color: #7a5a00; }
  .ev.poison { color: #6c3fa8; }
  .result { font-size: 18px; font-weight: 700; margin-top: 8px; }
  .fallen .row { margin: 4px 0; gap: 16px; }
  ul { margin: 4px 0; padding-left: 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin: 3px 0; }
  .chip { padding: 2px 8px; font-size: 13px; border-radius: 12px; }
  .chip.buff { border-color: #9cc8a8; background: #f1f8f3; }
  .chip.sabo { border-color: #e0a3a3; background: #fbf1f1; }
  .applied { display:inline-flex; gap:4px; align-items:center; background:#eef3fd; border-radius:12px; padding:1px 4px 1px 10px; font-size:13px; }
  .applied .x { padding: 0 6px; font-size: 12px; border-radius: 10px; }
  .market { border-top: 1px dashed var(--line); padding: 6px 0; }
  .mname { font-weight: 600; margin-bottom: 2px; }
  .ev.stand { color: #1e6a8a; font-weight: 600; }
  .mob { display: none; }
  @media (max-width: 640px) { .mob { display: inline; } }
  .tag.q { background:#e8e0f6; color:#4b2f86; }
  .tag.boss { background:#f6dcdc; color:#8a1f1f; }
  .beats { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .beats span { font-size:12px; padding:2px 10px; border-radius:12px; background:#f0efeb; color:var(--muted); }
  .beats span.on { background:var(--accent); color:#fff; }
  .beats span.done { background:#dfe9fb; color:#2a4f94; }
  .tip { background:#fff8e1; border:1px solid #f0d98a; border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  .tip .x { margin-left:10px; padding:1px 8px; font-size:12px; }
  .form { display:flex; flex-direction:column; gap:8px; margin:8px 0; }
  .form label { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .pos { display:flex; flex-direction:column; gap:2px; }
  td.hl { background:#fff3d6; font-weight:600; }
  td.wide { min-width: 180px; }
  table.matrix td, table.matrix th { text-align:center; }
  table.matrix td:first-child, table.matrix th:first-child { text-align:left; }
  .items { display:flex; flex-direction:column; gap:6px; margin:6px 0; }
  .item { display:block; border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  .item.sabo { border-color:#e0a3a3; background:#fdf6f6; }
  .item.buff { border-color:#9cc8a8; background:#f5fbf7; }
  .item.drop { border-color:#b9a0e0; background:#f7f3fd; }
  ul.bill li { margin:2px 0; }
  ul.bill li.muted { color:var(--muted); }
  p.total { font-size:15px; margin-top:8px; }
  table.statement { width:auto; min-width:320px; max-width:560px; }
  table.statement td { padding:4px 10px; }
  table.statement td.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  table.statement tr.sub td:first-child { padding-left:24px; }
  table.statement tr.line td { border-top:2px solid var(--ink); }
  table.statement tr.strong td { font-weight:700; font-size:15px; }
  .ev.up { color:#1e6a3a; }
  .ev.down { color:#8a4a1e; }
  .ev.rout, .ev.slump { color:#b0006e; font-weight:600; }
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .wrap { padding: 8px; }
    .header { position: static; }
    .header .stats { gap: 2px 12px; font-size: 13px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table.stack, table.stack tbody { display: block; overflow: visible; }
    table.stack thead { display: none; }
    table.stack tr { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 6px 0; }
    table.stack td { display: block; border: none; padding: 2px 0; white-space: normal; }
    table.stack td[data-l]::before { content: attr(data-l) "："; color: var(--muted); font-size: 12px; }
    table.stack td.desk { display: none; }
    table.statement { min-width: 0; width: 100%; display: table; }
    th, td { white-space: nowrap; }
    td .muted.small { white-space: normal; min-width: 140px; }
    table.tricks td { white-space: normal; }
  }
</style>
</head>
<body>
<div id="root"></div>
<!-- 配置文件：文字和数值都在 data 文件夹里，改完刷新页面即可生效 -->
<script>
// 所有配置文件共用的容器。请勿删除这个文件，它必须第一个加载。
var GAME_DATA = {};

</script>
<script>
// 经济与公式参数 v0.1（标准档的基础值；难度倍率见 difficulty.js）
// T = 当层魔王过路费。除勇者酒馆价外，所有价格都按 T 的倍数计算，所以楼层越高越贵。
GAME_DATA.economy = {
  // 魔王过路费：前 earlyFloors 层每层涨 earlyGrowth，之后每层涨 growth
  // T(f) = round10(base × earlyGrowth^(min(f, earlyFloors) - 1) × growth^(max(0, f - earlyFloors)))
  toll: { base: 30, earlyGrowth: 1.17, earlyFloors: 10, growth: 1.26 },

  // 单层押注上限（限红）= betCapMult × T；押注以 betUnit 为最小单位
  betCapMult: 4,
  betUnit: 10,

  // 天神复活香火费 R = round10(mult × T × growth^k)；k = 已复活人次，每进入新赛区 k 减 zoneDecay（最低 0）
  // perFloor = true：按场涨价——输掉一场不管复活几人，k 只 +1（v0.6.1）
  revive: { mult: 0.8, growth: 1.25, zoneDecay: 2, perFloor: true,
    winFallPays: false   // true = 赢球时倒下的人也要交香火费复活（否则免费复活 + 伤病）
  },

  // 舆论热度 H（赢球涨幅、输球跌幅每局在 jitter 区间内随机）
  heat: { start: 50, min: 10, max: 95, winPerStreak: 1 },

  // NPC 定赔率改为"盲区推演"（见 combat.js 的 GAME_DATA.npc）；赔率最低 minOdds，返还率按难度见 difficulty.js
  odds: { houseEdge: 0.99, minOdds: 1.1 },
  // v0.6 起砍掉"赌狗起疑"（保留字段只为兼容旧存档，enabled: false 时完全不生效）
  suspicion: { enabled: false, maxLevel: 0, perLevel: 0, decayFloors: 2 },

  // 热度：仍用于 NPC 推演（h = (热度 − 50) / 50）
  paper: { atkWeight: 3 },

  // 每局参数微调：开局在区间内随机取值并公布
  jitter: { heatWinBase: [4, 7], heatLoseDrop: [30, 40] },

  // 毒雾：从第 startRound 回合末开始，每回合末所有单位扣 first × factor^(n) 真实伤害
  poison: { startRound: 10, first: 2, factor: 2, maxRounds: 40 },

  // 楼层与怪物
  floors: { total: 30, bossEvery: 5 },
  // 本层 3 只怪物的纸面战力合计 = base × growth^(f-1)，Boss 层 × bossMult
  monsterPower: { base: 160, growth: 1.05, bossMult: 1.2, perMonsterJitter: 0.2 },

  // 装备：数值按掉落楼层放大 growth^(f-1)
  gear: { growth: 1.085, dropsPerWin: 1, dropsPerBossWin: 2 },

  // 酒馆：每局从勇者池里随机摆出 offerCount 名（每个档位至少 1 名）
  tavern: { offerCount: 8, minHeroes: 3, maxHeroes: 8 }, // v0.6.1：可带 3～8 人（逃跑永久离队后需要更厚的板凳）

  // 安全屋：价格均为当层过路费 T 的倍数
  // 出现位置：每个 Boss 层后，以及每个赛区第 midFloors 层后（3 → 第 3、8、13…层）
  safeHouse: { healT: 0.6, gearT: 1.5, unequipT: 0, // v0.6.3：安全屋卸装备免费
    marketSize: 3, midFloors: [3],
    // 补员：已决定不做（recruitSize 设为 0 即关闭）
    recruitSize: 0, recruitTiers: ["grass"], recruitMult: 1 },

  // 金库与入局
  vault: { stakeMin: 1000, stakeMax: 2000, sponsor: 1000 },

  // 出塔结算（撤离：只在 Boss 层打完、交完过路费后；通关：第 30 层后）
  //   赚到的钱 = 手上金币 − 带进塔的本金；魔王只抽"赚到的钱"的 profitTax；再还天神赞助（入门档免还）；
  //   带回金库的现金最多 min(cashCapStakeMult × 本金, cashCapAbs)，超出部分按每 prestigePer G 折 1 点声望
  retreat: {
    // v0.6.3：出塔结算只剩一句话——"还掉赞助，赚到的钱魔王抽 profitTax，到手最多 min(4×本金, 6000)，超出部分换声望"
    // 赚到的钱 = 出塔时手上的金币 − 带进塔的本金（自有 + 赞助）；没赚钱就不抽，本金不会被扣
    profitTax: 0.3,
    cashCapStakeMult: 4, cashCapAbs: 6000, prestigePer: 1000,
    // 以下为 v0.6.2 及以前的旧规则（profitTax 存在时不再使用，保留用于对照）
    feeTollMult: 3, noMinFeeFloors: [5], bonusPerAlive: 0.5, pensionPerDead: 0,
    taxBrackets: [ { uptoStake: 2, rate: 0.2 }, { uptoStake: null, rate: 0.5 } ]
  },

  // 勇者宿舍：撤离/通关时存活的勇者跟你回家（装备归还魔塔，伤病保留）
  // 出场费 = 酒馆价 × feeRates[已活着带出塔次数 - 1]（第 1 次 30%，第 2 次 50%，之后 70%）
  // 宿舍里可花金库现金疗伤（每个伤病 healCost G），也可免费解雇
  dorm: { capacity: 8, feeRates: [0.3, 0.5, 0.7], healCost: 80 },

  // 结局
  endings: { buyoutGold: 500000 }
};

</script>
<script>
// 三档难度（名字待 Kimi 起）。所有倍率都乘在 economy.js 的基础值上。
// houseEdge 是赌场返还率 = 1 − 抽水率（越高赔率越好，1 以上等于赌场倒贴）。v0.6.1：入门档 1.12（庄家倒贴 12%），标准档 1.02（庄家让利 2%），困难档 0.90（抽 10%）；让人头盘在此基础上再 × markets.handicap.edgeMul。
// sponsorRepay: false 表示天神赞助不用归还（入门档扶持新手）。
// 注意：本游戏的难度主要来自"经济"，所以调难度主要靠赔率和香火费，而不是怪物强弱。
GAME_DATA.difficulty = {
  easy:     { name: "入门档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 0.6, stakeMax: 2000, houseEdge: 1.12, sponsorRepay: false },
  standard: { name: "标准档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 1.0, stakeMax: 2000, houseEdge: 1.02 },
  hard:     { name: "困难档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 1.0, stakeMax: 2000, houseEdge: 0.90 }
};

</script>
<script>
// v0.6 战斗规则：五行 + 四职业双闭环、确定性蓄力暴击、站位、装备契合、NPC 盲区推演。
// 所有倍率都在这里，改数值不用动代码。
GAME_DATA.combat = {
  // 五行闭环：数组里前一个克后一个，首尾相接 —— 金克木、木克土、土克水、水克火、火克金
  elements: ["metal", "wood", "earth", "water", "fire"],
  elemNames: { metal: "金", wood: "木", earth: "土", water: "水", fire: "火" },
  elemAdv: 1.2,      // 克制方打被克制方：伤害 ×
  elemDisadv: 0.85,  // 被克制方打克制方：伤害 ×

  // 四职业闭环：beats = 克制谁（盾卫 → 刺客 → 法师 → 剑士 → 盾卫）
  // homes = 本职站位（1 号位最前）；target = 打谁：front 最前排 / back 最后排 / weakest 当前血量最低
  classes: {
    shield:   { name: "盾卫", beats: "assassin", homes: [1],    target: "front",   dmgTaken: 0.85 },
    assassin: { name: "刺客", beats: "mage",     homes: [2, 3], target: "back" },
    mage:     { name: "法师", beats: "sword",    homes: [2, 3], target: "weakest" },
    sword:    { name: "剑士", beats: "shield",   homes: [1, 2], target: "front" }
  },
  classAdv: 1.15,    // 职业克制方伤害 ×
  counterCap: 1.4,   // 五行 × 职业 叠乘后的上限（只封顶，不影响减伤那一侧）

  // 确定性蓄力暴击：每个单位每第 critEvery 次出手必定暴击，伤害 × critMult
  critEvery: 3, critMult: 1.5,

  // 不站本职站位：攻击 ×（唯利是图不受影响）
  offPosAtkMul: 0.7,

  // 装备契合（装备五行 vs 勇者五行）：同属性 same / 中立 neutral / 相克（克或被克）clash
  gearFit: { same: 1.3, neutral: 1.0, clash: 0.7 },
  // 本层主导属性（3 只怪里 2 只的属性）克制装备属性时，该装备加成 ×
  gearCountered: 0.5,

  // 怪物数值：界面显示一个区间（中值 ±monsterRange），真实值开打才揭晓
  monsterRange: 0.08,

  // 士气爆冷（全游戏唯一的玄学，双向、谁都不帮）：按 NPC 开出的勇者胜率 P 判定谁被看好，悬殊 gap = |P − 0.5|。
  //   被看好的一方 → 轻敌：本场有 slumpK × gap 的概率，其中 1 人开场失常（攻击 × slumpAtk）
  //   被看扁的一方 → 怯战：每人第一次掉到 routHpLine 以下时，有 routK × gap 的概率溃逃（勇者溃逃 = 永久离队；刚正不阿和 Boss 不会溃逃）
  //   设计目标：平均每 8～10 层出现一次爆冷，对胜率的平均影响接近 0
  morale: { slumpK: 0.25, routK: 0.1, slumpMax: 0.12, routMax: 0.05, routHpLine: 0.5, slumpAtk: 0.7 }
};

// NPC 盲区推演：NPC 看得见 基础面板、装备 100% 面板、站位与非本职惩罚、第 3 击暴击、怪癖、伤病、热度、怪物中值；
// 看不见 五行克制、职业克制、装备契合/被克折损（一律 ×1）、锁单后用的道具、怪物真实值。
// 胜率 P_win = clamp( sigmoid( logit(各次推演 sigmoid(k × S) 的平均) + alpha × h ), pMin, pMax )
//   S = 推演结果：勇者赢 → 勇者剩余血量占比（0～1）；勇者输 → −怪物剩余血量占比（−1～0）
//   h = (热度 − 50) / 50
// 让人头盘：折损 = 倒下 + 逃跑（输掉整场 = 上场人数）。NPC 按推演的平均折损开整数让人线（最少 1、最多上场人数 − 1），
//   P(少) = 推演里折损 < 线 的比例，P(多) = 折损 > 线 的比例，刚好等于线 = 走盘退本（不计入赔率）；再按热度微调、截断
// 赔率 = 返还率 ÷ 概率（返还率 = 1 − 抽水率，按难度见 difficulty.js），最低 1.1
GAME_DATA.npc = {
  sightElem: 0, sightCls: 0, // NPC 眼力：0 = 完全看不见五行/职业克制；1 = 全看得见；0～1 = 只看懂一部分
  samples: 16, // NPC 也知道怪物数值是区间：在区间里推演 samples 次，取平均（第 1 次用中值，界面展示这一次）
  k: 3, alpha: 1.6, pMin: 0.2, pMax: 0.8,
  alphaC: 0.5,              // 让人头盘：热度对"少"一方概率的影响（logit 尺度）
  pMinC: 0.2, pMaxC: 0.8    // 让人头盘"少/多"两边概率的截断区间
};

</script>
<script>
// v0.6 勇者：酒馆按"品级 × 职业 × 随机五行"现场生成，不再是固定名单。
// 名字、外号为占位，阶段 2 由 Kimi 文案替换；数值由 Claude 和 Gemini 定。
GAME_DATA.heroGen = {
  // 品级基础值（剑士的数值；其他职业按 classes 的倍率调整）
  tiers: {
    star:  { name: "明星", hp: 62, atk: 12.5, price: 220 },
    mid:   { name: "中坚", hp: 45, atk: 9.5,  price: 130 },
    grass: { name: "草根", hp: 29, atk: 6,    price: 60 }
  },
  // 职业对生命/攻击的倍率
  classes: {
    shield:   { hp: 1.25, atk: 0.75 },
    sword:    { hp: 1.0,  atk: 1.0 },
    assassin: { hp: 0.85, atk: 1.2 },
    mage:     { hp: 0.8,  atk: 1.15 }
