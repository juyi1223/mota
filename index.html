<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔塔操盘手 · 白盒 Demo</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#222; --muted:#777; --line:#e3e1dc; --accent:#2f6fde; --good:#1e8a4c; --bad:#c43c3c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 17px; margin: 0 0 8px; }
  h3 { font-size: 15px; margin: 16px 0 6px; }
  h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .header { position: sticky; top: 0; z-index: 5; }
  .header .big { font-size: 18px; font-weight: 600; }
  .stats { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:6px; }
  .stats b { font-size: 16px; }
  .odds b { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  tr.sel { background: #eef3fd; }
  tbody tr { cursor: default; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bad { color: var(--bad); }
  .good { color: var(--good); }
  .tag { display:inline-block; font-size:11px; padding:0 6px; margin-left:6px; border-radius:10px; background:#f1e6c8; color:#7a5a00; }
  button { font: inherit; padding: 5px 12px; border: 1px solid var(--line); background: #fafafa; border-radius: 6px; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 7px 18px; margin-top: 10px; }
  select, input[type=number] { font: inherit; padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; }
  input[type=number] { width: 110px; }
  .seed { display:block; margin: 8px 0; }
  .lineup, .bet { display:flex; flex-wrap:wrap; gap: 10px 18px; align-items:center; margin: 4px 0; }
  .lineup label, .bet label { display:flex; gap:6px; align-items:center; }
  .field { display:flex; align-items:center; gap: 12px; flex-wrap: wrap; }
  .side { flex: 1 1 360px; }
  .row { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
  .row.rev { flex-direction: row-reverse; justify-content: flex-end; }
  .vs { font-weight: 700; color: var(--muted); }
  .unit { border:1px solid var(--line); border-radius:6px; padding:6px 8px; width: 120px; }
  .unit.out { opacity: .45; }
  .hpbar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 4px 0 2px; }
  .hpbar div { height: 100%; background: var(--good); transition: width .2s; }
  .controls { margin: 10px 0; display:flex; gap:8px; }
  .log { max-height: 260px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px 10px; background:#fcfcfb; font-size: 13px; }
  .ev.crit { color: #b65d00; font-weight: 600; }
  .ev.dodge, .ev.miss, .ev.stun { color: var(--muted); }
  .ev.death { color: var(--bad); font-weight: 600; }
  .ev.flee { color: #7a5a00; }
  .ev.poison { color: #6c3fa8; }
  .result { font-size: 18px; font-weight: 700; margin-top: 8px; }
  .fallen .row { margin: 4px 0; gap: 16px; }
  ul { margin: 4px 0; padding-left: 20px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin: 3px 0; }
  .chip { padding: 2px 8px; font-size: 13px; border-radius: 12px; }
  .chip.buff { border-color: #9cc8a8; background: #f1f8f3; }
  .chip.sabo { border-color: #e0a3a3; background: #fbf1f1; }
  .applied { display:inline-flex; gap:4px; align-items:center; background:#eef3fd; border-radius:12px; padding:1px 4px 1px 10px; font-size:13px; }
  .applied .x { padding: 0 6px; font-size: 12px; border-radius: 10px; }
  .market { border-top: 1px dashed var(--line); padding: 6px 0; }
  .mname { font-weight: 600; margin-bottom: 2px; }
  .ev.stand { color: #1e6a8a; font-weight: 600; }
  @media (max-width: 640px) {
    body { font-size: 14px; }
    .wrap { padding: 8px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    th, td { white-space: nowrap; }
    td .muted.small { white-space: normal; min-width: 140px; }
    table.tricks td { white-space: normal; }
  }
</style>
</head>
<body>
<div id="root"></div>
<!-- 配置文件：文字和数值都在 data 文件夹里，改完刷新页面即可生效 -->
<script>
// 所有配置文件共用的容器。请勿删除这个文件，它必须第一个加载。
var GAME_DATA = {};

</script>
<script>
// 经济与公式参数 v0.1（标准档的基础值；难度倍率见 difficulty.js）
// T = 当层魔王过路费。除勇者酒馆价外，所有价格都按 T 的倍数计算，所以楼层越高越贵。
GAME_DATA.economy = {
  // 魔王过路费：前 earlyFloors 层每层涨 earlyGrowth，之后每层涨 growth
  // T(f) = round10(base × earlyGrowth^(min(f, earlyFloors) - 1) × growth^(max(0, f - earlyFloors)))
  toll: { base: 30, earlyGrowth: 1.17, earlyFloors: 10, growth: 1.26 },

  // 单层押注上限（限红）= betCapMult × T；押注以 betUnit 为最小单位
  betCapMult: 4,
  betUnit: 10,

  // 天神复活香火费 R = round10(mult × T × growth^k)；k = 已复活人次，每进入新赛区 k 减 zoneDecay（最低 0）
  revive: { mult: 0.8, growth: 1.25, zoneDecay: 2 },

  // 舆论热度 H（赢球涨幅、输球跌幅每局在 jitter 区间内随机）
  heat: { start: 50, min: 10, max: 95, winPerStreak: 1 },

  // NPC 纸面战力：UnitPower = 生命 + atkWeight × 攻击（忽略暴击、闪避、性格、负面效果）
  paper: { atkWeight: 3, scoreBase: 50, scoreSpread: 40, scoreMin: 10, scoreMax: 90 },

  // NPC 押"勇者胜"的资金占比 p = clamp((heatWeight×H + paperWeight×P_score + 波动) / 100, min, max)
  pub: { heatWeight: 0.65, paperWeight: 0.35, min: 0.12, max: 0.88, noise: 5 },

  // 赔率 = max(minOdds, round2(返还率 / 占比))；返还率按难度见 difficulty.js
  odds: { houseEdge: 0.99, minOdds: 1.1 },

  // 赌狗起疑（等级 0～maxLevel，界面公开）：
  // 押败且押中 +1；本层对勇者用了"可疑"小动作（害勇者的那类）再 +1；押中赔率 ≥ longshotOdds 的副盘冷门再 +1；
  // 连续 decayFloors 层两者都没发生则 -1；每级让押败赔率 × (1 - perLevel)
  suspicion: { maxLevel: 3, perLevel: 0.25, decayFloors: 2, longshotOdds: 3 },

  // 每局参数微调：开局在区间内随机取值并公布
  jitter: { heatWinBase: [4, 7], heatLoseDrop: [30, 40] },

  // 毒雾：从第 startRound 回合末开始，每回合末所有单位扣 first × factor^(n) 真实伤害
  poison: { startRound: 10, first: 2, factor: 2, maxRounds: 40 },

  // 楼层与怪物
  floors: { total: 30, bossEvery: 5 },
  // 本层 3 只怪物的纸面战力合计 = base × growth^(f-1)，Boss 层 × bossMult
  monsterPower: { base: 160, growth: 1.05, bossMult: 1.2, perMonsterJitter: 0.2 },

  // 装备：数值按掉落楼层放大 growth^(f-1)
  gear: { growth: 1.085, dropsPerWin: 1, dropsPerBossWin: 2 },

  // 酒馆：每局从勇者池里随机摆出 offerCount 名（每个档位至少 1 名）
  tavern: { offerCount: 6, minHeroes: 3, maxHeroes: 6 },

  // 安全屋：价格均为当层过路费 T 的倍数
  // 出现位置：每个 Boss 层后，以及每个赛区第 midFloors 层后（3 → 第 3、8、13…层）
  safeHouse: { healT: 0.6, gearT: 1.5, unequipT: 0.8, marketSize: 3, midFloors: [3],
    // 补员：已决定不做（recruitSize 设为 0 即关闭）
    recruitSize: 0, recruitTiers: ["grass"], recruitMult: 1 },

  // 金库与入局
  vault: { stakeMin: 1000, stakeMax: 2000, sponsor: 1000 },

  // 出塔结算（撤离：只在 Boss 层打完、交完过路费后；通关：第 30 层后）
  // 1. 付绩效分红：每名存活勇者 bonusPerAlive × T（v0.1 起不再收抚恤金）
  // 2. 交出塔税：剩余金币按"本局本金的倍数"分档累进；撤离时至少交 feeTollMult × T，
  //    但 noMinFeeFloors 里的楼层（第 5 层）和通关免这条下限
  // 3. 还天神赞助（入门档免还）
  // 4. 带回金库的现金最多 min(cashCapStakeMult × 本金, cashCapAbs)，超出部分按每 prestigePer G 折 1 点声望
  retreat: {
    feeTollMult: 3, noMinFeeFloors: [5], bonusPerAlive: 0.5, pensionPerDead: 0,
    taxBrackets: [ { uptoStake: 2, rate: 0.2 }, { uptoStake: null, rate: 0.5 } ],
    cashCapStakeMult: 4, cashCapAbs: 6000, prestigePer: 1000
  },

  // 勇者宿舍：撤离/通关时存活的勇者跟你回家（装备归还魔塔，伤病保留）
  // 出场费 = 酒馆价 × feeRates[已活着带出塔次数 - 1]（第 1 次 30%，第 2 次 50%，之后 70%）
  // 宿舍里可花金库现金疗伤（每个伤病 healCost G），也可免费解雇
  dorm: { capacity: 8, feeRates: [0.3, 0.5, 0.7], healCost: 80 },

  // 结局
  endings: { buyoutGold: 500000 }
};

</script>
<script>
// 三档难度（名字待 Kimi 起）。所有倍率都乘在 economy.js 的基础值上。
// houseEdge 是赌场返还率（越高赔率越好，1 以上等于赌场倒贴）：入门档 1.08，标准档 0.99，困难档 0.90。
// sponsorRepay: false 表示天神赞助不用归还（入门档扶持新手）。
// 注意：本游戏的难度主要来自"经济"，所以调难度主要靠赔率和香火费，而不是怪物强弱。
GAME_DATA.difficulty = {
  easy:     { name: "入门档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 0.6, stakeMax: 2000, houseEdge: 1.08, sponsorRepay: false },
  standard: { name: "标准档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 1.0, stakeMax: 2000, houseEdge: 0.99 },
  hard:     { name: "困难档（暂名）", tollMult: 1.0, monsterMult: 1.0, reviveMult: 1.0, stakeMax: 2000, houseEdge: 0.90 }
};

</script>
<script>
// 性格（固定槽，不可替换）。mechanic 是程序识别的机制代码，请勿修改；名字和描述可随意改。
GAME_DATA.traits = {
  steady:    { name: "稳如老狗", desc: "没有任何花样，老老实实打最前面的敌人。", mechanic: "none" },
  assassin:  { name: "专挑后排", desc: "优先攻击敌方最靠后的单位。", mechanic: "targetBack" },
  bully:     { name: "欺软怕硬", desc: "优先攻击当前生命值最低的敌人。", mechanic: "targetWeakest" },
  coward:    { name: "见血就跑", desc: "自身生命低于 30% 时逃离战斗：不算倒下、不吃伤病，但也不算存活。", mechanic: "flee", param: 0.3 },
  berserker: { name: "越打越疯", desc: "生命低于 50% 时攻击力 +50%。", mechanic: "berserk", param: 0.5, bonus: 0.5 },
  showoff:   { name: "人来疯", desc: "站在 1 号位时攻击 +30%，站在别的位置攻击 -30%。", mechanic: "frontBonus", bonus: 0.3 }
};

</script>
<script>
// 勇者池。tier: star 明星 / mid 中坚 / grass 草根。
// 名字、外号、描述为占位，阶段 2 由 Kimi 文案替换；数值由 Claude 和 Gemini 定。
GAME_DATA.heroes = [
  { id: "star_wall",   tier: "star",  name: "铁壁·阿强",   price: 220, hp: 70, atk: 11, crit: 0,    dodge: 0,    trait: "steady" },
  { id: "star_blade",  tier: "star",  name: "剑圣·老王",   price: 240, hp: 56, atk: 15, crit: 0,    dodge: 0,    trait: "steady" },
  { id: "star_vet",    tier: "star",  name: "老兵·大刘",   price: 200, hp: 62, atk: 11, crit: 0,    dodge: 0,    trait: "steady" },
  { id: "mid_shadow",  tier: "mid",   name: "影刺·小七",   price: 140, hp: 40, atk: 10, crit: 0.1,  dodge: 0.1,  trait: "assassin" },
  { id: "mid_runner",  tier: "mid",   name: "跑得快·二狗", price: 120, hp: 50, atk: 9,  crit: 0,    dodge: 0.1,  trait: "coward" },
  { id: "grass_plain", tier: "grass", name: "炮灰·张三",   price: 50, hp: 32, atk: 6,  crit: 0,    dodge: 0,    trait: "steady" },
  { id: "grass_crit",  tier: "grass", name: "神经刀·李四", price: 60, hp: 26, atk: 6,  crit: 0.4,  dodge: 0,    trait: "showoff" },
  { id: "grass_dodge", tier: "grass", name: "神经刀·王五", price: 70, hp: 26, atk: 6,  crit: 0,    dodge: 0.4,  trait: "berserker" }
];

</script>
<script>
// 怪物原型池。每层从池中随机抽 3 只，按当层战力预算生成数值。
// hpShare：战力预算中分给生命的比例（其余按 1/3 换成攻击，因为纸面战力里攻击权重为 3）。
// minFloor：从第几层开始出现。名字为占位，阶段 2 由 Kimi 替换。
GAME_DATA.monsters = [
  { id: "slime",    name: "加班史莱姆", hpShare: 0.72, crit: 0,    dodge: 0,    trait: "steady",    minFloor: 1 },
  { id: "goblin",   name: "绩效哥布林", hpShare: 0.55, crit: 0,    dodge: 0,    trait: "steady",    minFloor: 1 },
  { id: "bat",      name: "摸鱼蝙蝠",   hpShare: 0.6,  crit: 0,    dodge: 0.25, trait: "steady",    minFloor: 1 },
  { id: "imp",      name: "赌徒小恶魔", hpShare: 0.55, crit: 0.3,  dodge: 0,    trait: "steady",    minFloor: 2 },
  { id: "hound",    name: "背刺地狱犬", hpShare: 0.55, crit: 0,    dodge: 0,    trait: "assassin",  minFloor: 3 },
  { id: "orc",      name: "暴躁兽人",   hpShare: 0.6,  crit: 0,    dodge: 0,    trait: "berserker", minFloor: 3 },
  { id: "wraith",   name: "欺软幽灵",   hpShare: 0.5,  crit: 0.15, dodge: 0.15, trait: "bully",     minFloor: 6 },
  { id: "golem",    name: "合同工石像", hpShare: 0.8,  crit: 0,    dodge: 0,    trait: "steady",    minFloor: 6 }
];

// Boss 原型（Boss 层的 1 号怪物从这里抽，其余 2 只照常从上面的池里抽）
GAME_DATA.bosses = [
  { id: "boss_manager", name: "中层经理",   hpShare: 0.65, crit: 0.1, dodge: 0,   trait: "steady",    minFloor: 5 },
  { id: "boss_auditor", name: "审计魔像",   hpShare: 0.7,  crit: 0,   dodge: 0.1, trait: "bully",     minFloor: 10 },
  { id: "boss_vp",      name: "魔界副总",   hpShare: 0.6,  crit: 0.2, dodge: 0.1, trait: "berserker", minFloor: 20 }
];

</script>
<script>
// 装备池。kind: real 真打装 / fake 假赛阴间装。
// real = 实际生效的效果；paper = NPC 赌客"看得到"的效果（只看加生命、加攻击）。
// scaled: true 表示数值按掉落楼层放大（见 economy.gear.growth）。
// 字段说明：hp/atk 加值；hpMul/atkMul 乘数；crit/dodge 加概率；stunRounds 开场发呆回合数；missEvery 每第 N 次攻击打空；firstCrit 首击必暴；dmgTakenMul 受伤乘数。
GAME_DATA.gear = [
  { id: "iron_sword",   kind: "real", name: "趁手铁剑", scaled: true,  real: { atk: 8 },          paper: { atk: 8 } },
  { id: "leather",      kind: "real", name: "加厚皮甲", scaled: true,  real: { hp: 26 },          paper: { hp: 26 } },
  { id: "war_axe",      kind: "real", name: "开山斧",   scaled: true,  real: { atk: 5, hp: 12 }, paper: { atk: 5, hp: 12 } },
  { id: "lucky_coin",   kind: "real", name: "幸运硬币", scaled: false, real: { crit: 0.25 },      paper: {} },
  { id: "slick_cloak",  kind: "real", name: "滑溜斗篷", scaled: false, real: { dodge: 0.2 },     paper: {} },
  { id: "gilded_sword", kind: "fake", name: "镀金木剑", scaled: true,  real: { atkMul: 0.7 },     paper: { atk: 12 } },
  { id: "paper_armor",  kind: "fake", name: "纸糊铠甲", scaled: true,  real: { dmgTakenMul: 1.3 }, paper: { hp: 40 } },
  { id: "lead_boots",   kind: "fake", name: "灌铅战靴", scaled: true,  real: { hp: 16, stunRounds: 2 }, paper: { hp: 16 } }
];

</script>
<script>
// 伤病（战斗中倒下后获得，占用灵活槽）。NPC 赌客看不到伤病的影响。
GAME_DATA.injuries = [
  { id: "fracture",  name: "骨折",   desc: "攻击 -30%",         real: { atkMul: 0.7 } },
  { id: "internal",  name: "内伤",   desc: "生命上限 -30%",     real: { hpMul: 0.7 } },

  { id: "jinxed",    name: "霉运缠身", desc: "暴击率、闪避率清零", real: { noLuck: true } },
  { id: "fragile",   name: "玻璃身子", desc: "受到伤害 +25%",     real: { dmgTakenMul: 1.25 } }
];

</script>
<script>
// 赛前小动作：每层随机供货几种（见文件末尾 trickRules），赔率锁定后、开战前，给任意上场勇者使用；只对本场生效，NPC 看不到。
// 每名上场勇者都可以叠加多个小动作；价格 = priceT × 当层过路费 T × escalate^(本层已用小动作总数)，越用越贵。
// 效果只用确定值，不含概率。suspicious: true 的小动作（害自己人的），本层只要用了一次，赌狗起疑等级 +1。
// kind：buff 帮勇者 / sabotage 害勇者。名字和描述为占位，文案待 Kimi 改。
GAME_DATA.tricks = [
  // ---- 帮勇者（真打用）----
  { id: "soup",     kind: "buff", name: "大补汤",   desc: "本场生命 +30%",                       priceT: 0.3, effect: { hpMul: 1.3 } },
  { id: "blood",    kind: "buff", name: "打鸡血",   desc: "本场攻击 +30%",                       priceT: 0.3, effect: { atkMul: 1.3 } },
  { id: "charm",    kind: "buff", name: "开光护符", desc: "本场第一次攻击必定暴击",              priceT: 0.2, effect: { firstCrit: true } },
  { id: "mirror",   kind: "buff", name: "护心镜",   desc: "本场受到伤害 -25%",                   priceT: 0.3, effect: { dmgTakenMul: 0.75 } },

<script>
// 副盘口（v0.5）：每层只有一个常驻的【让分完胜盘】，仿照亚洲让球盘。
//   上盘 clean  = "零损完胜"：勇者赢球，且上场勇者无人倒下、无人逃跑。
//   下盘 broken = "未能完胜 / 破功"：勇者战败；或者赢了，但至少 1 名上场勇者倒下或逃跑（"赢球输盘"）。
//
// 定价：NPC 先做"纸面推演"（派纸面最强 3 人、按纸面战力站位，没有暴击闪避性格伤病小动作），
// 按推演结果分三档，用胜负盘的 NPC 胜率估计 p_pub 算上盘概率：
//   p_clean = clamp(p_pub × mul, min, max)
// 赔率 = 返还率 ÷ 概率（上盘用 p_clean，下盘用 1 − p_clean），先按 maxOdds 封顶，
// 非热门一方再乘赌狗起疑折扣 × (1 − 0.25 × 起疑等级)，最后不低于 1.1。热门 = 概率大的一方。
//
// 限红：让分盘最多押 capT × 当层过路费 T；与胜负盘合计不超过本层押注上限 4T。
// 起疑：押中让分盘的"非热门"一方且赔率 ≥ longshotOdds，赌狗起疑 +1。
GAME_DATA.markets = {
  handicap: {
    enabled: true,
    capT: 2,
    maxOdds: 8,
    longshotOdds: 2.5,
    pClean: {
      clean:   { mul: 0.85, min: 0.15, max: 0.82 }, // 纸面推演：勇者零损完胜
      scraped: { mul: 0.45, min: 0.12, max: 0.55 }, // 纸面推演：勇者赢了但有人倒下（带损险胜）
      lost:    { mul: 0.25, min: 0.12, max: 0.35 }  // 纸面推演：勇者战败
    }
  }
};

</script>
