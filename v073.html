<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔塔操盘手 v0.7.6</title>
<style>
:root { --bg:#f6f5f1; --card:#fff; --ink:#1f1f1f; --muted:#6b6b6b; --line:#e2e0da; --accent:#2f6fde; --good:#1e8a4a; --bad:#c0392b; --gold:#a8730a; --dark:#6a3fb5; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:980px; margin:0 auto; padding:12px; }
h1 { font-size:20px; margin:4px 0 2px; } h3 { font-size:15px; margin:10px 0 6px; } p { margin:6px 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
.bar { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; } .bar .sp { flex:1; }
.top { position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.06); }
.wrapbtn { display:flex; flex-wrap:wrap; gap:4px; } .wrapbtn button { padding:3px 8px; font-size:12px; }
button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.on { background:#1f1f1f; color:#fff; border-color:#1f1f1f; }
button:disabled { opacity:.45; cursor:not-allowed; } button.small { padding:3px 8px; }
.muted { color:var(--muted); } .small { font-size:12px; } .good { color:var(--good); } .bad { color:var(--bad); } .gold { color:var(--gold); font-weight:700; }
.err { font-weight:700; }
.units { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.unit { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fcfcfa; position:relative; transition:transform .15s; }
.unit.dead { opacity:.45; } .unit.boss { border-color:#b03030; background:#fff6f6; }
.unit.tgt { outline:3px solid var(--accent); cursor:pointer; background:#eef3fd; }
.unit.tgt2 { cursor:pointer; } .unit.picked { outline:3px solid var(--good); background:#eefaf2; }
.unit.acting { transform:translateY(-8px) scale(1.03); box-shadow:0 0 0 3px #f0b429; z-index:2; }
.unit.hit { animation:shake .35s; box-shadow:0 0 0 3px #e06a5a; } .unit.healed { box-shadow:0 0 0 3px #4cb876; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.pop { position:absolute; top:2px; right:4px; background:rgba(255,255,255,.88); border-radius:6px; padding:0 4px; font-weight:800; font-size:18px; color:var(--bad); animation:rise .9s forwards; pointer-events:none; white-space:nowrap; z-index:3; }
.pop.heal { color:var(--good); } .pop.crit { color:#d35400; font-size:22px; } .pop.graze { color:#888; } .pop.info { color:var(--dark); font-size:14px; } .pop.dead { color:#000; }
@keyframes rise { 0%{opacity:0; transform:translateY(8px)} 20%{opacity:1} 100%{opacity:1; transform:translateY(-10px)} }
.nm { font-weight:700; } .lv { font-size:11px; background:#1f1f1f; color:#fff; border-radius:8px; padding:0 6px; font-weight:400; }
.badge { position:absolute; top:-8px; right:6px; background:var(--good); color:#fff; font-size:11px; border-radius:8px; padding:0 6px; }
.hp { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:3px 0; } .hp > div { height:100%; background:var(--good); transition:width .3s; } .unit.M .hp > div { background:#c0392b; }
.tags span { display:inline-block; font-size:11px; padding:0 6px; border-radius:10px; background:#f0efeb; margin:2px 2px 0 0; }
.tags .trap { background:#efe4fb; color:var(--dark); } .tags .buff { background:#e3f3e8; color:var(--good); } .tags .debuff { background:#fbe5e2; color:var(--bad); }
.intent { font-size:12px; color:#8a1f1f; margin-top:2px; } .intent b { font-size:13px; }
.pv { font-size:12px; color:var(--accent); font-weight:700; margin-top:2px; }
.order { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12px; margin:6px 0; }
.order span { padding:1px 8px; border-radius:10px; background:#f0efeb; } .order span.muted { background:none; padding:0; } .order span.now { background:#f0b429; color:#000; font-weight:700; } .order i { color:#bbb; font-style:normal; }
.banner { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); background:rgba(20,20,20,.88); color:#fff; font-size:24px; font-weight:800; padding:12px 26px; border-radius:12px; z-index:60; animation:bn .9s forwards; pointer-events:none; text-align:center; max-width:90vw; }
@keyframes bn { 0%{opacity:0; transform:translate(-50%,-50%) scale(.8)} 15%{opacity:1; transform:translate(-50%,-50%) scale(1.05)} 80%{opacity:1} 100%{opacity:0} }
.hand { display:flex; flex-wrap:wrap; gap:8px; }
.fc { width:160px; border:2px solid var(--line); border-radius:10px; padding:6px 8px; background:#fff; }
.hand > .fc[data-a] { cursor:pointer; } .fc.sel { border-color:var(--accent); background:#eef3fd; } .fc.no { opacity:.6; }
.fc .cost { float:right; font-weight:700; background:#1f1f1f; color:#fff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:12px; }
.fc .ty { font-size:11px; color:var(--muted); } .fc.trap { border-color:#c9b2ee; } .fc.dark { border-color:#e3a59d; } .fc.black { border-color:#555; } .fc.star { border-color:#e2c35a; } .fc.hero { border-color:#8fc49f; }
.rar-rare { color:#1d5fd1; } .rar-legend { color:#c2620a; }
.kw { display:inline-block; font-size:11px; background:#1f1f1f; color:#fff; border-radius:8px; padding:0 6px; margin-right:4px; }
.pts { font-size:18px; }
.ticket { background:#fffdf3; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; }
.log { max-height:240px; overflow:auto; font-size:12px; background:#fbfaf7; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.log div { padding:1px 0; border-bottom:1px dotted #eee; } .log .r { font-weight:700; color:var(--accent); border:none; margin-top:4px; } .log .t { color:var(--dark); } .log .x { color:var(--bad); }
table.st { border-collapse:collapse; width:100%; max-width:560px; } table.st td { padding:4px 8px; border-bottom:1px solid var(--line); } table.st td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.st tr.tot td { border-top:2px solid var(--ink); font-weight:700; font-size:15px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
input[type=number] { width:100px; padding:5px; font:inherit; } textarea { width:100%; font:12px monospace; }
.opt { display:block; padding:5px 8px; border:1px solid var(--line); border-radius:8px; margin:4px 0; cursor:pointer; } .opt.on { border-color:var(--accent); background:#eef3fd; } .opt.closed { background:#f3f2ee; color:var(--muted); cursor:default; }
.hint { background:#fff8e1; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; font-size:13px; margin:6px 0; } .warn { color:#9a5b00; font-size:12px; }
details summary { cursor:pointer; font-weight:700; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
.modal { position:fixed; left:50%; top:5vh; transform:translateX(-50%); width:min(900px,94vw); max-height:88vh; overflow:auto; background:#fff; border-radius:12px; padding:12px 14px; z-index:50; }
.modal .x { float:right; }
@media (max-width:640px) { .wrap { padding:8px; } .fc { width:calc(50% - 4px); } .units { grid-template-columns:repeat(3,1fr); gap:6px; } .unit { padding:5px; font-size:12px; } .banner { font-size:19px; } .top { font-size:12px; } }

.fin.on { border-color:var(--accent); background:#eef3fd; }

</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
// =====================================================================
// 配置区：所有数值、名字、文字、图片路径都在这个文件里改
// =====================================================================
const CONFIG = {
  version: "0.7.6",
  floors: 50, bossEvery: 5,
  startGold: 300, startHeroes: ["shield", "sword", "priest"], teamMax: 6, fieldMax: 3, blackSlots: 5, deckMin: 6,
  startDeck: [["strike", 4], ["guard", 3], ["mend", 2], ["oracle", 1]],
  capBase: 100, capGrow: 1.124,                 // 限红 C(f) = 100 × 1.124^(f−1)
  stages: [                                     // 庄家返还率 R、普通层赏金（×C）
    { to: 5, R: 1.05, bounty: 0.5, name: "新手期" }, { to: 20, R: 0.95, bounty: 0.3, name: "成长期" },
    { to: 35, R: 0.92, bounty: 0.3, name: "中期" }, { to: 50, R: 0.90, bounty: 0.3, name: "后期" } ],
  bossBounty: 1.5, bossToll: 5,
  // 第 50 层三个结局。fix=世纪假赛：倍率 = R ÷ 庄家眼里勇者（没人帮）输的概率，截在 [minOdds, maxOdds]，可押全部金币
  // duel=堂堂正正：魔王按全队最强 3 人调到庄家估计胜率 duelTarget，且不低于标准魔王的 duelFloor 倍。tower=买下魔塔：价格 towerPrice×C
  finale: { R: 1.0, minOdds: 1.5, maxOdds: 10, duelTarget: 0.5, duelFloor: 0.3, towerPrice: 300 },
  extract: { 5: 0.15, 10: 0.25, 15: 0.35, 20: 0.45, 25: 0.5, 30: 0.5, 35: 0.5, 40: 0.5, 45: 0.5, 50: 1 },   // 第 25 层起锁在 50%，只有第 50 层的结局是 100%
  basePoints: 3, handSize: 5, buyBase: 0.1, maxBuy: 5,
  pClamp: [0.15, 0.95],                         // 胜率 ≥ 95% 的那一边"稳局不开盘"
  live: { R: 0.85, cap: 3.0, capLeak: 3.5 },
  payoutCap: 4, payoutCapHouse: 6,              // 主盘 + 滚球派彩合计上限（×C）
  parlay: { R: 0.7, min: 1.3, max: 2.0, maxParlayer: 2.5, offer: 3 },
  script: { R: 0.8, min: 1.5, max: 6, cap: 0.25, rerollBase: 0.1, writer: 1, bard: 0.5 },
  // 复活：赢了全员免费复活；普通层输了交过路费 normalToll×C（不交则这场阵亡的勇者永久失去）；战斗中原地复活每人 inBattle×C
  revive: { inBattle: 1.0, inBattleHp: 0.5, normalToll: 1.0, tollMonk: 0.5, tollFake: 0.5, tollComet: 0.25 },
  luck: { crit: 0.10, critMul: 2, graze: 0.10, grazeMul: 0.5 },
  trapperBonus: 1.5, guillotinePct: 0.3, traitorPct: 0.2, bardBuff: 4, miserGold: 0.05,
  bossAoe: 0.6, bossShield: 0.12,
  escalateFrom: 8, maxRounds: 15,
  heat: { start: 50, min: 10, max: 95, win: 5, lose: -35, hype: 10, show: 10, bias: 0.004, gamblerAt: 70 }, // bias：热度每高 1 点，庄家把勇者数值高估 0.4%
  bookieSims: 300, liveSims: 200,
  bookieGod: { points: [2, 3, 3, 4], atk: 6, shield: 8, heal: 10 },   // 数值同样随层数放大
  anim: { stepMs: 600 },
  // 怪物强度：倍率 K(f) 从 m1 起，每层乘 growth；弱怪层 = 基准数值，强怪层 = 生命 ×(1+tierHp)、攻击 ×(1+tierAtk)
  monster: { m1: 1.0, growth: [{ to: 5, g: 1.08 }, { to: 20, g: 1.12 }, { to: 35, g: 1.145 }, { to: 50, g: 1.165 }],
    weakRate: 0.3, tutorialT: [0.5, 0.6, 0.68, 0.75], tierHp: 0.4, tierAtk: 1.0, bossScale: 1.2 },
  // 养成：勇者每升 1 级，生命/攻击/治疗 ×mult；每级 cost×C；等级上限 = 当前层数。命运牌的固定数值按"层数等级"同样放大
  level: { mult: 1.12, cost: 0.05 },
  shop: { fates: 2, misc: 2, del: 0.5, refresh: 0.3, rarity: { common: 65, rare: 28, legend: 7 },
    price: { fate: { basic: 0.3, common: 0.5, rare: 1, legend: 2 }, black: { common: 1, rare: 2, legend: 3 },
      star: { common: 0.5, rare: 1.2, legend: 2.5 }, hero: { basic: 1, common: 1.5, rare: 2.5, legend: 4 } } },
  blackEffects: { cousin: 0.5, insurer: 0.2, fixer: 0.2, stash: 0.1, lifeins: 0.15, bitter: 0.1, gate: 0.02, comeback: 0.10 },
  hallMax: 12,
};

// act：front=打最前面的敌人 back=打最后面的 lowest=打血最少的 heal=给血最少的队友回血 bard=不攻击
const HEROES = {
  shield:  { name: "盾卫", rarity: "basic", hp: 60, atk: 4, act: "front", img: "" },
  sword:   { name: "剑士", rarity: "basic", hp: 45, atk: 8, act: "front", img: "" },
  rogue:   { name: "刺客", rarity: "basic", hp: 30, atk: 10, act: "back", img: "" },
  mage:    { name: "法师", rarity: "basic", hp: 28, atk: 7, act: "lowest", img: "" },

  gambler: { name: "赌徒", rarity: "common", hp: 40, atk: 8, act: "front", skill: "gambler", kw: "热度", desc: "每次攻击随机 1～16；热度 ≥ 70 时最低 8", img: "" },
  miser:   { name: "守财奴", rarity: "common", hp: 38, atk: 3, act: "front", skill: "miser", kw: "金币", desc: "他活着在场时，每回合给你 0.05C 金币", img: "" },
  trapper: { name: "陷阱师", rarity: "common", hp: 35, atk: 5, act: "front", skill: "trapper", kw: "陷阱", desc: "每场开始免费埋 1 个陷阱（绊马索或地雷）；他活着时你的地雷、荆棘伤害 +50%", img: "" },
  monk:    { name: "不死僧", rarity: "rare", hp: 40, atk: 6, act: "front", skill: "monk", kw: "复活", desc: "他上阵的场次，普通层输了的过路费减半", img: "" },
  martyr:  { name: "殉道者", rarity: "rare", hp: 50, atk: 5, act: "front", skill: "martyr", kw: "阵亡", desc: "他阵亡的那个回合，全队攻击 ×2", img: "" },
  bard:    { name: "吟游诗人", rarity: "rare", hp: 30, atk: 0, act: "bard", skill: "bard", kw: "剧本", desc: "不攻击；轮到他时给攻击最高的队友本回合加攻击（第 1 层 +4，随层数成长）；他上阵时剧本盘赔率 +0.5", img: "" },
  seer:    { name: "神棍", rarity: "rare", hp: 32, atk: 4, act: "front", skill: "seer", kw: "点数", desc: "他活着在场时，每回合多给你 1 点", img: "" },
  traitor: { name: "叛徒", rarity: "legend", hp: 45, atk: 14, act: "front", skill: "traitor", kw: "暗箱", desc: "攻击很高，但每次出手有 20% 概率改打相邻队友（庄家知道）", img: "" },

// target：unit=任一单位（Boss 除外） hero=勇者 any=任一单位（含 Boss） trapMonster=敌人（含 Boss） priest=会治疗的勇者
//         heroThenMonster / twoHeroes / monsterThenAny = 要点两次  none=不用选目标
const CARDS = {

  weaken:    { name: "虚弱诅咒", rarity: "common", cost: 1, ty: "暗箱", target: "unit", kw: "暗箱", desc: "一个单位本回合攻击 −50%" },
  taunt:     { name: "嘲讽号角", rarity: "common", cost: 1, ty: "功能", target: "hero", desc: "本回合所有敌人只打这名勇者" },
  swap:      { name: "乾坤大挪移", rarity: "common", cost: 1, ty: "功能", target: "twoHeroes", desc: "交换两名上阵勇者的站位（出手顺序和挨打顺序跟着变）" },
  vamp:      { name: "吸血獠牙", rarity: "common", cost: 2, ty: "功能", target: "unit", desc: "一个单位本回合造成伤害的一半转为自己回血" },
  coin:      { name: "抛硬币", rarity: "common", cost: 0, ty: "暗箱", target: "unit", kw: "暗箱", desc: "一个单位本回合攻击 50% 概率 ×2，50% 概率 ×0.5" },

  holyfool:  { name: "圣愚之光", rarity: "rare", cost: 2, ty: "剧本", target: "priest", kw: "剧本", desc: "牧师本回合改为攻击最前面的敌人，伤害 = 治疗量 × 2" },

// ---------------- 结算 ----------------
function finishBattle() {

  let mainPay = mainHit ? Math.floor(m.amt * m.odds * m.mult) : 0;
  let livePay = sideHit ? BT.lives.reduce((a, l) => a + Math.floor(l.amt * l.odds), 0) : 0;
  let bonus = 0; const bonusNotes = [];
  if (m.side === "lose" && sideHit && mainPay + livePay > 0) {
    if (has("bitter") && res.deaths) { const add = Math.floor((mainPay + livePay) * be.bitter * Math.min(3, res.deaths)); bonus += add; bonusNotes.push(`苦肉计 +${add}`); }

  }

  const scriptHit = BT.script.amt > 0 && SCRIPTS[BT.script.key].test(res, G.foe.n);
  const scriptPay = scriptHit ? Math.floor(BT.script.amt * BT.script.odds) : 0;
  const fix = G.finale === "fix";
  const bounty = win && !fix ? Math.round((G.foe.boss ? CONFIG.bossBounty : stageOf(G.floor).bounty) * c) : 0;
  const diedUnits = heroes(b).filter(h => b.flags.died[h.uid]);
  const lifeins = has("lifeins") ? diedUnits.length * Math.round(be.lifeins * c) : 0;
  const heat0 = G.heat, hc = CONFIG.heat;
  G.heat = clamp(G.heat + (win ? hc.win + (has("hype") ? hc.hype : 0) : hc.lose) + b.heatGain, hc.min, hc.max);
  const gate = has("gate") ? Math.round(Math.floor(G.heat / 10) * be.gate * c) : 0;
  const toll = win || fix ? 0 : G.foe.boss ? Math.round(CONFIG.bossToll * c) : normalToll(b);

    stakes: m.amt + liveStake + BT.script.amt, tollChoice: null, fix, bossLoss: !win && G.foe.boss && !fix, tollFree: !win && !G.foe.boss && toll === 0 };

}
const tollPaid = () => (BT.S.tollChoice === "pay" ? BT.S.toll : 0);
const goldAfterSettle = () => G.gold - tollPaid();
function billNet() {
  const S = BT.S, betProfit = S.mainPay + S.livePay + S.bonus + S.scriptPay + S.refund - S.stakes;

}
function setToll(v) {

  if (v === "pay" && G.gold < S.toll) return { ok: false, err: "金币不够交过路费" };

}
function confirmSettle() {
  const S = BT.S, b = BT.b, bill = billNet(), win = S.win;

  if (S.fix) { BT = null; Q = null; return endRun(win ? "oops" : "fix"); }
  if (S.tollChoice === "wipe") { BT = null; return endRun("wipe"); }
  if (S.tollChoice === "pay") { G.gold -= S.toll; if (S.toll) G.stats.tolls++; }
  else if (S.tollChoice === "abandon") for (const h of heroes(b)) if (h.dead) {

  if (rate > 0) for (const m of G.team) if (!(kind === "fix" && G.lineup.includes(m.id)) && grand() < rate) { out.push(m.name); META.hall.push(m.key); }

// ---------------- 奖励与商店 ----------------
function rollRarity(r, w) { const tot = Object.values(w).reduce((a, x) => a + x, 0); let x = r() * tot; for (const k of Object.keys(w)) { x -= w[k]; if (x < 0) return k; } return Object.keys(w)[0]; }

}
function genReward() { G.reward = rollFrom(CARDS, 3, grand, CONFIG.shop.rarity); }
function pickReward(i) { if (i != null && G.reward[i]) G.deck.push(G.reward[i]); G.reward = null; genShop(); G.phase = "shop"; autosave(); }
function genShop(keepRefresh) {

  const fates = rollFrom(CARDS, sc.fates, grand, sc.rarity).map(k => ({ key: k, sold: false }));
  for (let i = 0; i < sc.misc; i++) {
    const isBlack = grand() < 0.5 && G.blacks.length + misc.filter(x => x.type === "black").length < Object.keys(BLACKS).length;
    const defs = isBlack ? BLACKS : STARS;
    const k = rollFrom(defs, 1, grand, sc.rarity, key => misc.some(x => x.key === key) || (isBlack && has(key)))[0];
    if (k) misc.push({ type: isBlack ? "black" : "star", key: k, sold: false });

}
const priceMul = (type, key) => { const d = { fate: CARDS, black: BLACKS, star: STARS, hero: HEROES }[type][key]; return key === "pluto" ? 0 : d.price || CONFIG.shop.price[type][d.rarity]; };
const priceOf = (type, key) => (key === "pluto" ? 0 : money(priceMul(type, key)));
function buyFate(i) { const it = G.shop.fates[i], p = priceOf("fate", it.key); if (it.sold) return { ok: false, err: "卖掉了" }; if (G.gold < p) return { ok: false, err: "金币不够" }; G.gold -= p; G.deck.push(it.key); it.sold = true; autosave(); return { ok: true }; }

    case "venus": m.hpAdd += 15; m.atkAdd -= 2; break; case "saturn": m.atkAdd += 5; m.hpAdd -= 8; break;
    case "comet": m.atkAdd += 6; m.comet = (m.comet || 0) + 1; break; case "polaris": m.hpAdd += 20; break;
    case "pluto": m.atkAdd -= 4; m.hidden += 4; break; case "supernova": m.mult *= 1.5; break;

}

  const p = priceOf(it.type, it.key);

// ---------------- 战斗 ----------------
function shownAtk(b, u) { const t = TT(b, u); return Math.max(0, Math.round((u.atk + t.atkAdd) * t.atkMul)); }
function previewText(id, u) {
  const b = BT.b, t = TT(b, u), a = shownAtk(b, u), n = CARD_NUM[id] ? scaled(b, CARD_NUM[id]) : 0, noAtk = u.side === "H" && (u.act === "heal" || u.act === "bard");
  switch (id) {
    case "strike": case "showtime": return noAtk ? "他不攻击，加了没用" : `攻击 ${fmt(a)} → ${fmt(Math.round((u.atk + t.atkAdd + n) * t.atkMul))}`;
    case "rage": case "berserk": return noAtk ? "他不攻击，加了没用" : `攻击 ${fmt(a)} → ${fmt(a * 2)}${id === "berserk" ? "，受伤 ×2" : ""}`;
    case "weaken": return noAtk ? "他不攻击，没效果" : `攻击 ${fmt(a)} → ${fmt(Math.round(a / 2))}`;
    case "coin": return noAtk ? "他不攻击，没效果" : `攻击 ${fmt(a * 2)} 或 ${fmt(Math.round(a / 2))}`;
    case "guard": case "bigshield": return `护盾 ${fmt(t.shield)} → ${fmt(t.shield + n)}`;
    case "mend": return `生命 ${fmt(u.hp)} → ${fmt(Math.min(u.maxHp, u.hp + n))}`;
    case "doze": return "本回合不行动";
    case "slip": { if (u.act === "heal") return TT(b, u).holy ? "圣愚 + 手滑 = ？？？" : "会把血奶给怪物"; if (u.act === "bard") return "会给怪物伴奏"; const al = adjacentAlly(b, u); return al ? `会砍到 ${al.name}` : "身边没有队友"; }
    case "soulswap": return U.stage ? `生命 ${fmt(u.hp)} ⇄ ${fmt(unitById(b, U.first).hp)}` : `交出生命 ${fmt(u.hp)}`;
    case "swap": return U.stage ? `和 ${unitById(b, U.first).name} 换位` : `现在 ${u.pos + 1} 号位`;
    case "rewrite": return U.stage ? `让 ${unitById(b, U.first).name} 打它` : `攻击 ${fmt(a)}，由你指定打谁`;
    case "tripwire": return "下一个打他的敌人摔倒";
    case "mine": return `下次挨打 +${fmt(Math.round(n * trapBonus(b)))}`;
    case "guillotine": return `生命 ≤ ${fmt(Math.floor(u.maxHp * CONFIG.guillotinePct))} 时处决（现在 ${fmt(u.hp)}）`;
    case "thorns": return "下次挨打原样反弹";
    case "fakedeath": return "他阵亡后这场若输，过路费少 0.5C";
    case "holyfool": return TT(b, u).slip ? "圣愚 + 手滑 = ？？？" : `改为攻击，伤害 ${fmt(u.heal * 2)}`;
    case "taunt": return "本回合敌人都打他";
    case "vamp": return "伤害的一半转为回血";
    case "flee": return "本回合不行动也不挨打";
    case "sacrifice": return u.hp <= n ? `失去 ${fmt(n)} 生命：会阵亡！` : `生命 ${fmt(u.hp)} → ${fmt(u.hp - n)}，你 +1 点`;
    case "bloodrite": return `立即阵亡，敌人各受 ${fmt(Math.round(u.maxHp * 0.5))}`;
  }
  return "";
}
function intentText(b, m, plan) {
  const it = b.intents[m.uid]; if (!it || m.dead) return "";
  const t = TT(b, m);
  if (t.sleep) return "意图：打瞌睡，本回合不动";
  if (it.kind === "charge" || it.kind === "shield" || it.kind === "summon") return `意图：${TEXT.intent[it.kind]}`;
  const mul = (it.kind === "smash" ? 2 : it.kind === "aoe" ? CONFIG.bossAoe : 1) * escOf(b);
  const base = Math.round(m.atk * mul), cur = Math.round(shownAtk(b, m) * mul);
  const dmgTxt = (base !== cur ? fmt(base) + " → " + fmt(cur) : fmt(cur)) + (t.coin ? "（抛硬币 ×2 或 ×0.5）" : "");
  if (it.kind === "aoe") { const trip = targetH(b).find(h => trapOn(b, "tripwire", h.uid)); return `意图：群攻，每名勇者 <b>${dmgTxt}</b>${trip ? "<br>会被绊马索绊倒，这次作废" : ""}`; }
  const verb = TEXT.intent[it.kind], r = plan && plan[m.uid];
  if (r && r.info) {
    const tg = unitById(b, r.target);
    if (r.info.tripped) return `意图：${verb} <b>${dmgTxt}</b> → ${tg.name}<br>会被绊马索绊倒，这次作废`;
    const notes = [];
    if (r.info.mine) notes.push(`踩地雷 +${fmt(r.info.mine)}`);
    if (r.info.absorbed) notes.push(`护盾挡 ${fmt(r.info.absorbed)}`);
    if (trapOn(b, "thorns", tg.uid)) notes.push("会被荆棘反弹");
    if (notes.length) notes.push(`实际掉血 ${fmt(r.info.real)}`);
    return `意图：${verb} <b>${dmgTxt}</b> → ${tg.name}${t.redirect ? "（命运重写）" : b.taunt === tg.uid ? "（被嘲讽）" : ""}${notes.length ? `<br>${notes.join("，")}` : ""}`;
  }
  const tg = monsterTarget(b, m);
  return `意图：${verb} <b>${dmgTxt}</b> → ${tg ? tg.name : "—"}`;
}
function unitHTML(u, b, clickable, plan) {

  let hp = u.hp, dead = u.dead, armor = u.armor || 0;
  if (snap) { const sn = snap.units.find(x => x.uid === u.uid); if (!sn) return ""; hp = sn.hp; dead = sn.dead; armor = sn.armor; }
  const temp = U.anim && U.pre ? U.pre.temp : b.temp, t = temp[u.uid] || NO_T, taunt = U.anim && U.pre ? U.pre.taunt : b.taunt, traps = snap ? snap.traps : b.traps;

  if (t.atkMul !== 1) tags.push(`<span class="${t.atkMul > 1 ? "buff" : "debuff"}">攻×${t.atkMul}</span>`);

  if (t.redirect) tags.push(`<span class="debuff">被重写</span>`);
  if (taunt === u.uid) tags.push(`<span class="buff">嘲讽</span>`);

  if (u.fake && dead) tags.push(`<span class="trap">假死</span>`);
  const intent = u.side === "M" && !dead && !U.anim && G.phase === "battle" ? intentText(b, u, plan) : "";
  const sub = u.side === "H" ? (u.act === "heal" ? `治疗 ${fmt(u.heal)}` : u.act === "bard" ? "伴奏" : `攻击 ${fmt(u.atk)}`) : `攻击 ${fmt(u.atk)}${u.boss ? "　免疫直接操控" : ""}`;
  let cls = "", pop = "";

    ${pop}<div class="nm">${u.side === "H" ? u.pos + 1 + " " : ""}${u.name}${dead ? "（阵亡）" : ""}</div>
    <div class="hp"><div style="width:${Math.max(0, hp) / u.maxHp * 100}%"></div></div>
    <div class="small">${fmt(Math.max(0, hp))} / ${fmt(u.maxHp)}　${sub}</div>
    <div class="tags">${tags.join("")}</div>
    ${intent ? `<div class="intent">${intent}</div>` : ""}${pv ? `<div class="pv">${pv}</div>` : ""}
  </div>`;

function ticketHTML() {

      ${BT.liveThisRound ? `<p class="good">已追加滚球 ${fmt(BT.lives[BT.lives.length - 1].amt)} G × ${BT.lives[BT.lives.length - 1].odds}</p>` : ""}

function settleHTML() {

  const others = [];
  if (G.stash) others.push(`小金库 ${fmt(G.stash)}`); if (BT.miser) others.push(`守财奴 ${fmt(BT.miser)}`); if (S.lifeins) others.push(`阵亡保险 ${fmt(S.lifeins)}`); if (S.gate) others.push(`门票分成 ${fmt(S.gate)}`);
  const dead = heroes(b).filter(h => h.dead);

      <div class="row"><label><input type="radio" name="toll" data-a="toll" data-v="abandon" ${S.tollChoice === "abandon" ? "checked" : ""}> 不交：这场阵亡的 ${dead.map(h => h.name).join("、")} 永久失去${dead.length >= G.team.length ? "（队伍就没人了，这一局结束）" : ""}</label></div>
      ${can ? "" : `<p class="bad">现在手上 ${fmt(G.gold)} G，交不起过路费。</p>`}`;
  } else {

      <div class="row"><label><input type="radio" name="toll" data-a="toll" data-v="pay" ${S.tollChoice === "pay" ? "checked" : ""} ${can ? "" : "disabled"}> 交 ${fmt(S.toll)} G（${CONFIG.bossToll}C）：${G.floor >= CONFIG.floors ? "全队免费复活，逛完商店再打一次最终 Boss" : "算过关，全队免费复活，但没有赏金，也不能在这里撤离"}</label></div>

    <div class="row"><button class="primary" data-a="confirm">${S.tollChoice === "wipe" ? "确认团灭" : "确认结算"}</button></div></div>
    <div class="card"><h3>战斗记录</h3>${logHTML(b)}</div>`;

    const canDel = G.phase === "shop", cnt = {}; G.deck.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
    inner = `<h3>牌库（${G.deck.length} 张${canDel ? `，删一张 −${fmt(money(CONFIG.shop.del))} G，最少留 ${CONFIG.deckMin} 张` : ""}）</h3><div class="hand">${Object.keys(cnt).map(k => cardBox(k, `<div class="row"><b>× ${cnt[k]}</b>${canDel ? `<button class="small" data-a="del" data-v="${k}">删 1 张</button>` : ""}</div>`)).join("")}</div>`;
  } else if (U.modal === "blacks") inner = `<h3>黑幕牌（${G.blacks.length} / ${CONFIG.blackSlots}，只管下注，庄家看不见）</h3>${G.blacks.length ? `<div class="hand">${G.blacks.map((bk, i) => { const d = BLACKS[bk.key]; return `<div class="fc black"><b class="${rarCls(d.rarity)}">${d.name}</b><div class="ty">${TEXT.rarity[d.rarity]}</div><div class="small">${kwChip(d)}${d.desc}</div>${G.phase === "shop" ? `<div class="row"><button class="small" data-a="sell" data-i="${i}">卖掉 +${fmt(bk.paid / 2)} G</button></div>` : ""}</div>`; }).join("")}</div>` : `<p class="muted">还没有黑幕牌，去商店买。</p>`}`;
  else if (U.modal === "save") inner = `<h3>存档</h3><p class="muted small">游戏会在每层备战、结算后、逛商店时自动存档。战斗打到一半刷新网页，会回到本层备战。</p>
    <div class="row"><button data-a="saveSlot">存到手动存档位</button>${hasSlot() ? `<button data-a="loadSlot">读取手动存档</button>` : ""}</div>
    <div class="row"><button data-a="export">导出存档码</button><button data-a="import">导入存档码</button></div>
    <textarea id="code" rows="3" placeholder="导出后复制这里的文字；导入时把存档码粘贴到这里再点导入">${esc(U.codeOut)}</textarea>
    <div class="row"><button data-a="home">回到首页（进度已自动保存）</button></div>`;
  else if (U.modal === "rules") inner = rulesHTML().replace("<details>", "<details open>");
  return `<div class="mask" data-a="closeModal"></div><div class="modal"><button class="x" data-a="closeModal">关闭</button>${inner}</div>`;
}

// ---------------- 事件 ----------------
function resetSel() { U.sel = null; U.stage = 0; U.first = null; U.offer = null; }
function clickCard(i) {
  const id = BT.hand[i], cost = cardCost(id);
  U.offer = null; U.err = "";
  if (cost > BT.points) {
    const k = cost - BT.points;
    if (BT.bought + k > CONFIG.maxBuy) { U.err = "点数不够，本回合也买不了那么多点"; resetSel(); return render(); }
    let price = 0; for (let j = 0; j < k; j++) price += pointPrice(BT.bought + j);
    resetSel(); U.offer = { i, k, price }; return render();
  }
  if (CARDS[id].target === "none") { resetSel(); return act(playCard(i)); }
  if (U.sel === i) resetSel(); else { resetSel(); U.sel = i; }
  render();
}
function clickUnit(uid) {
  if (U.sel === null || G.phase !== "battle") return;
  const id = BT.hand[U.sel], u = unitById(BT.b, uid);
  if (!validTarget(id, u, U.stage, U.first)) return;
  if (twoStep(id) && !U.stage) { U.first = uid; U.stage = 1; return render(); }
  const i = U.sel, a = twoStep(id) ? U.first : uid, c = twoStep(id) ? uid : null;
  resetSel(); act(playCard(i, a, c));
}
async function uiEndTurn() {
  if (U.anim) return;
  U.gold0 = G.gold; U.heat0 = G.heat; resetSel(); U.err = "";
  const r = endTurn();
  U.anim = true; U.pre = r.pre; U.skip = false;
  for (const f of r.frames) { if (U.skip) break; U.frame = f; render(); await sleep(CONFIG.anim.stepMs / U.speed); }
  U.anim = false; U.frame = null; U.pre = null; render();
}
const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s.trim())));
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, i = Number(el.dataset.i), id = el.dataset.id;
  U.msg = "";
  if (a === "speed") { U.speed = Number(v); return render(); }
  if (a === "skip") { U.skip = true; return; }
  if (U.anim) return;
  switch (a) {
    case "modal": U.modal = v; U.codeOut = ""; return render();
    case "closeModal": U.modal = null; return render();
    case "new": newRun(U.hallPick); U.hallPick = null; U.modal = null; U.err = ""; return render();
    case "continue": try { loadAuto(); } catch (x) { U.err = "存档读不出来"; } return render();
    case "loadSlot": try { loadSlot(); U.modal = null; U.msg = "已读取手动存档"; } catch (x) { U.err = "手动存档读不出来"; } return render();
    case "saveSlot": U.msg = saveSlot() ? "已存到手动存档位（存的是最近一次自动存档的进度）" : "现在没有可存的进度"; return render();
    case "export": try { U.codeOut = b64e(exportData()); U.msg = "存档码已生成，复制下面文本框里的文字"; } catch (x) { U.err = "导出失败"; } return render();
    case "import": try { importData(b64d(document.getElementById("code").value)); U.modal = null; U.codeOut = ""; U.msg = "存档码导入成功"; } catch (x) { U.err = "存档码不对，导入失败"; } return render();
    case "home": G = null; BT = null; Q = null; U.modal = null; return render();
    case "pick": { const mid = Number(id), k = G.lineup.indexOf(mid); if (k >= 0) G.lineup.splice(k, 1); else if (G.lineup.length < CONFIG.fieldMax) G.lineup.push(mid); else U.err = `最多上阵 ${CONFIG.fieldMax} 人，先点掉一个`; return render(); }
    case "clearLineup": G.lineup = []; return render();
    case "train": return act(train(Number(id)));
    case "trainAll": trainAll(G.team.map(m => m.id)); return render();
    case "open": return act(openBook());
    case "side": G.bet.side = v; G.bet.parlay = null; return render();
    case "parlay": G.bet.parlay = v || null; return render();
    case "amtq": G.bet.amt = Number(v); return render();
    case "samtq": G.bet.scriptAmt = Number(v); return render();
    case "reroll": return act(rerollScript());
    case "back": G.phase = "prep"; Q = null; return render();
    case "fight": resetSel(); return act(startBattle());
    case "rev": return act(reviveInBattle(id));
    case "live": return act(placeLive(Number(document.getElementById("liveamt").value) || 0));
    case "toplay": BT.step = "play"; U.err = ""; return render();
    case "buy": return act(buyPoint());
    case "buyplay": { const o = U.offer; if (!o) return; if (G.gold < o.price) { U.err = "金币不够"; return render(); } for (let j = 0; j < o.k; j++) buyPoint(); U.offer = null; return clickCard(o.i); }
    case "nobuy": U.offer = null; return render();
    case "card": return clickCard(i);
    case "unit": return clickUnit(id);
    case "end": uiEndTurn(); return;
    case "toll": return act(setToll(v));
    case "confirm": confirmSettle(); U.err = ""; window.scrollTo(0, 0); return render();
    case "extract": decideExtract(true); return render();
    case "stay": decideExtract(false); return render();
    case "reward": pickReward(i >= 0 ? i : null); return render();
    case "buyFate": return act(buyFate(i));
    case "buyBlack": return act(buyMisc(i));
    case "buyStar": if (STARS[G.shop.misc[i].key].team) return act(buyMisc(i)); U.starPick = i; return render();
    case "starTo": { const r = buyMisc(U.starPick, Number(id)); if (r.ok) U.starPick = null; return act(r); }
    case "starCancel": U.starPick = null; return render();
    case "buyHero": return act(buyHero());
    case "refresh": U.starPick = null; return act(refreshShop());
    case "del": return act(deleteCard(G.deck.indexOf(v)));
    case "sell": return act(sellBlack(i));
    case "leave": U.starPick = null; leaveShop(); U.err = ""; window.scrollTo(0, 0); return render();
    case "finale": if (!v) { G.finale = null; G.foe = genFloor(G.floor); Q = null; return render(); } return act(chooseFinale(v));
    case "hall": U.hallPick = v === "" ? null : Number(v); return render();
  }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.a;
  if (a === "amt") { G.bet.amt = Math.max(0, Number(el.value) || 0); render(); }
  if (a === "samt") { G.bet.scriptAmt = Math.max(0, Number(el.value) || 0); render(); }
});
document.title = TEXT.title;
render();

</script>
</body>
