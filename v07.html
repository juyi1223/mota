<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔塔操盘手 v0.7 · 单场战斗原型</title>
<style>
  :root { --bg:#f6f5f1; --card:#fff; --ink:#1f1f1f; --muted:#6b6b6b; --line:#e2e0da; --accent:#2f6fde; --good:#1e8a4a; --bad:#c0392b; --gold:#a8730a; --dark:#6a3fb5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:12px; }
  h1 { font-size:18px; margin:4px 0 8px; }
  h3 { font-size:15px; margin:10px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .bar .sp { flex:1; }
  button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.on { background:#1f1f1f; color:#fff; border-color:#1f1f1f; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .muted { color:var(--muted); } .small { font-size:12px; } .good { color:var(--good); } .bad { color:var(--bad); } .gold { color:var(--gold); font-weight:700; }
  .units { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
  .unit { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fcfcfa; position:relative; }
  .unit.dead { opacity:.45; }
  .unit.boss { border-color:#b03030; background:#fff6f6; }
  .unit.tgt { outline:3px solid var(--accent); cursor:pointer; background:#eef3fd; }
  .unit .nm { font-weight:700; }
  .hp { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:3px 0; }
  .hp > div { height:100%; background:var(--good); }
  .unit.M .hp > div { background:#c0392b; }
  .tags span { display:inline-block; font-size:11px; padding:0 6px; border-radius:10px; background:#f0efeb; margin:2px 2px 0 0; }
  .tags .trap { background:#efe4fb; color:var(--dark); }
  .tags .buff { background:#e3f3e8; color:var(--good); }
  .tags .debuff { background:#fbe5e2; color:var(--bad); }
  .intent { font-size:12px; color:#8a1f1f; margin-top:2px; }
  .hand { display:flex; flex-wrap:wrap; gap:8px; }
  .fc { width:150px; border:2px solid var(--line); border-radius:10px; padding:6px 8px; background:#fff; cursor:pointer; }
  .fc.sel { border-color:var(--accent); background:#eef3fd; }
  .fc.no { opacity:.45; cursor:not-allowed; }
  .fc .cost { float:right; font-weight:700; background:#1f1f1f; color:#fff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:12px; }
  .fc .ty { font-size:11px; color:var(--muted); }
  .fc.trap { border-color:#c9b2ee; } .fc.dark { border-color:#e3a59d; }
  .ticket { background:#fffdf3; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; }
  .log { max-height:260px; overflow:auto; font-size:12px; background:#fbfaf7; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
  .log div { padding:1px 0; border-bottom:1px dotted #eee; }
  .log .r { font-weight:700; color:var(--accent); border:none; margin-top:4px; }
  .log .t { color:var(--dark); } .log .x { color:var(--bad); }
  table.st { border-collapse:collapse; min-width:300px; }
  table.st td { padding:4px 10px; border-bottom:1px solid var(--line); }
  table.st td.n { text-align:right; font-variant-numeric:tabular-nums; }
  table.st tr.tot td { border-top:2px solid var(--ink); font-weight:700; font-size:15px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:4px 0; }
  input[type=number] { width:90px; padding:5px; font:inherit; }
  select { font:inherit; padding:4px; }
  label.opt { display:block; padding:4px 8px; border:1px solid var(--line); border-radius:8px; margin:4px 0; cursor:pointer; }
  label.opt.on { border-color:var(--accent); background:#eef3fd; }
  .hint { background:#fff8e1; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; font-size:13px; }
  @media (max-width:640px) { .wrap { padding:8px; } .fc { width:calc(50% - 4px); } .units { grid-template-columns:repeat(3,1fr); } .unit { padding:5px; font-size:12px; } }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
// =====================================================================
// 配置区：数值、勇者、怪物、牌、文字都在这里改
// =====================================================================
const CONFIG = {
  C: 200,                 // 本层限红（原型按第 8～10 层的量级）
  startGold: 1500,        // 测试用金币
  basePoints: 3,          // 每回合送的点数
  handSize: 5,
  buyBase: 0.1,           // 每回合第 n 个加买点数的价格 = buyBase × C × 2^(n−1)
  maxBuy: 5,
  R: 0.95,                // 战前主盘返还率
  pClamp: [0.15, 0.85],   // 庄家胜率截断
  live: { R: 0.85, cap: 3.0, min: 1.05 },        // 滚球
  payoutCap: 4,           // 主盘 + 滚球派彩合计 ≤ 4C
  parlay: { R: 0.7, min: 1.3, max: 2.0 },        // 加码条款倍率 = R / 条件概率，截在 [min, max]
  script: { R: 0.8, min: 1.5, max: 6, cap: 0.25 }, // 剧本盘赔率 = R / 概率；限红 0.25C
  bounty: { normal: 0.3, boss: 1.0 },            // 赢了才有，×C
  bossToll: 5,            // Boss 层战败的过路费 ×C
  revive: { inBattle: 1.0, after: 0.5, inBattleHp: 0.5 },
  escalateFrom: 8,        // 第 8 回合起伤害每回合翻倍
  maxRounds: 15,          // 超过算勇者输
  bookieSims: 300,        // 庄家推演次数
  liveSims: 200,
  bookieGod: { points: [2, 3, 3, 4], atk: 6, shield: 8, heal: 10 }, // 庄家假想的"普通天神"
  heroes: [
    { id: "shield", name: "盾卫", hp: 60, atk: 4, act: "front", invest: 100 },
    { id: "sword",  name: "剑士", hp: 45, atk: 8, act: "front", invest: 100 },
    { id: "priest", name: "牧师", hp: 32, atk: 0, heal: 12, act: "heal", invest: 100 },
    { id: "rogue",  name: "刺客", hp: 30, atk: 10, act: "back", invest: 100 },
    { id: "mage",   name: "法师", hp: 28, atk: 7, act: "lowest", invest: 100 },
    { id: "martyr", name: "殉道者", hp: 50, atk: 5, act: "front", invest: 250, skill: "martyr" },
  ],
  defaultLineup: ["shield", "sword", "priest"],
  monsters: {
    normal: [ { name: "骷髅兵", hp: 42, atk: 20 }, { name: "史莱姆", hp: 52, atk: 15 }, { name: "哥布林", hp: 34, atk: 21 } ],
    boss:   [ { name: "魔王监工", hp: 155, atk: 27, boss: true, pattern: ["attack", "attack", "charge", "smash"] }, { name: "小鬼", hp: 30, atk: 12 } ],
  },
  // 测试牌库（20 张）
  deck: [["strike", 2], ["guard", 2], ["mend", 2], ["oracle", 1], ["rage", 2], ["slip", 1], ["doze", 1], ["weaken", 1], ["soulswap", 1],
         ["tripwire", 1], ["mine", 1], ["guillotine", 1], ["fakedeath", 1], ["holyfool", 1], ["taunt", 1], ["lastgasp", 1]],
  // target: unit=任一单位（Boss 除外） hero=勇者 monster=怪物（Boss 除外） trapMonster=怪物（含 Boss） heroThenMonster=先选勇者再选怪物 priest=会治疗的勇者 none=不用选
  cards: {
    strike:     { name: "强攻",     cost: 1, ty: "基础",       target: "unit",  desc: "一个单位本回合攻击 +6" },
    guard:      { name: "守护",     cost: 1, ty: "基础",       target: "unit",  desc: "一个单位本回合护盾 +8" },
    mend:       { name: "治愈",     cost: 1, ty: "基础",       target: "unit",  desc: "一个单位回复 10 生命" },
    oracle:     { name: "神谕",     cost: 0, ty: "基础",       target: "none",  desc: "抽 2 张牌" },
    rage:       { name: "狂暴药水", cost: 1, ty: "暗箱",       target: "unit",  desc: "一个单位本回合攻击 ×2（给怪物用 = 放水）" },
    slip:       { name: "手滑",     cost: 0, ty: "暗箱",       target: "hero",  desc: "一名勇者本回合改打相邻队友" },
    doze:       { name: "打瞌睡",   cost: 1, ty: "暗箱",       target: "unit",  desc: "一个单位本回合不行动" },
    weaken:     { name: "虚弱诅咒", cost: 1, ty: "暗箱",       target: "unit",  desc: "一个单位本回合攻击 −50%" },
    soulswap:   { name: "灵魂互换", cost: 2, ty: "暗箱",       target: "heroThenMonster", desc: "交换一名勇者和一个怪物的当前生命（不超过各自上限）" },
    tripwire:   { name: "绊马索",   cost: 1, ty: "陷阱",       target: "hero",  desc: "埋在一名勇者面前：第一个来打他的敌人摔倒，这次攻击作废（Boss 也会中）" },
    mine:       { name: "地雷",     cost: 1, ty: "陷阱",       target: "none",  desc: "下一个被攻击的单位（不分敌我）额外受 15 伤害" },
    guillotine: { name: "断头台",   cost: 2, ty: "陷阱",       target: "trapMonster", desc: "埋给一个敌人（可以是 Boss）：它生命降到 30% 以下时立即处决" },
    fakedeath:  { name: "假死机关", cost: 1, ty: "陷阱",       target: "hero",  desc: "埋给一名勇者：他下次阵亡算阵亡，但战后免费复活" },
    holyfool:   { name: "圣愚之光", cost: 2, ty: "剧本",       target: "priest", desc: "牧师本回合改为攻击最前面的敌人，伤害 = 治疗量 × 2" },
    taunt:      { name: "嘲讽号角", cost: 1, ty: "功能",       target: "hero",  desc: "本回合所有敌人只打这名勇者" },
    lastgasp:   { name: "回光返照", cost: 2, ty: "复活",       target: "none",  desc: "本回合阵亡的勇者以 1 生命免费原地复活" },
  },
};
const TEXT = {
  title: "魔塔操盘手 v0.7 · 单场战斗原型",
  modeNormal: "普通层（可押赢 / 押输）", modeBoss: "Boss 层（只能押赢）",
  restart: "重开（新种子）", rehand: "换随机手牌",
  intro: "你是腐败天神：先押勇者的输赢，再用命运牌暗中左右战斗。庄家看得见勇者和怪物，看不见你的牌库、你埋的陷阱、你会加买几个点。",
  bossNote: "Boss 免疫直接指向它的牌，但会触发陷阱（绊马索、地雷、断头台）。",
};

// =====================================================================
// 工具
// =====================================================================
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const fmt = x => Math.round(x).toLocaleString("en-US");
const sgn = x => (x > 0 ? "+" : x < 0 ? "−" : "") + fmt(Math.abs(x));
const pick = (r, a) => a[Math.floor(r() * a.length)];
function shuffle(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const C = () => CONFIG.C;
const down10 = x => Math.max(0, Math.floor(x / 10) * 10);

// =====================================================================
// 战斗引擎（真实战斗和庄家推演共用）
// =====================================================================
function makeBattle(mode, lineupIds) {
  const units = [];
  lineupIds.forEach((id, i) => {
    const d = CONFIG.heroes.find(h => h.id === id);
    units.push({ uid: "H" + i, side: "H", id, name: d.name, maxHp: d.hp, hp: d.hp, atk: d.atk, heal: d.heal || 0, act: d.act, pos: i, dead: false, fake: false, invest: d.invest, skill: d.skill || null });
  });
  CONFIG.monsters[mode].forEach((m, i) => units.push({ uid: "M" + i, side: "M", name: m.name, maxHp: m.hp, hp: m.hp, atk: m.atk, pos: i, dead: false, boss: !!m.boss, pattern: m.pattern || null }));
  return { mode, units, round: 1, traps: [], temp: {}, taunt: null, lastGasp: false, martyrBoost: false, winner: null,
    flags: { anyDeath: false, priestActed: false, lastKiller: null, bossByTrap: false, endRound: null, deaths: 0 }, intents: {}, log: [] };
}
const heroes = b => b.units.filter(u => u.side === "H");
const monsters = b => b.units.filter(u => u.side === "M");
const aliveH = b => heroes(b).filter(u => !u.dead).sort((a, c) => a.pos - c.pos);
const aliveM = b => monsters(b).filter(u => !u.dead).sort((a, c) => a.pos - c.pos);
const T = (b, u) => (b.temp[u.uid] = b.temp[u.uid] || { atkAdd: 0, atkMul: 1, shield: 0, sleep: false, slip: false, holy: false });
const unitById = (b, uid) => b.units.find(u => u.uid === uid);
const trapOn = (b, kind, uid) => b.traps.find(t => t.kind === kind && t.on === uid);

function computeIntents(b) {
  b.intents = {};
  const front = aliveH(b)[0];
  for (const m of aliveM(b)) {
    if (m.boss) {
      const k = m.pattern[(b.round - 1) % m.pattern.length];
      b.intents[m.uid] = k === "charge" ? { kind: "charge" } : { kind: k, dmg: k === "smash" ? m.atk * 2 : m.atk, target: front && front.uid };
    } else b.intents[m.uid] = { kind: "attack", dmg: m.atk, target: front && front.uid };
  }
}
function atkValue(b, u) {
  const t = T(b, u);
  let a = (u.atk + t.atkAdd) * t.atkMul;
  if (u.side === "H" && b.martyrBoost) a *= 2;
  return Math.max(0, Math.round(a));
}
function checkEnd(b) {
  if (b.winner) return true;
  if (aliveM(b).length === 0) { b.winner = "H"; b.flags.endRound = b.round; return true; }
  if (aliveH(b).length === 0) { b.winner = "M"; b.flags.endRound = b.round; return true; }
  return false;
}
function heroDown(b, h, L) {
  if (b.lastGasp && !h.gasped) { h.hp = 1; h.gasped = true; L(`回光返照！${h.name} 以 1 生命站了起来`, "t"); return; }
  const fd = trapOn(b, "fakedeath", h.uid);
  if (fd) { b.traps.splice(b.traps.indexOf(fd), 1); h.fake = true; L(`假死机关触发：${h.name} "阵亡"了（战后免费复活）`, "t"); }
  h.dead = true; h.hp = 0; b.flags.anyDeath = true; b.flags.deaths++;
  L(`${h.name} 阵亡`, "x");
  if (h.skill === "martyr") { b.martyrBoost = true; L(`殉道者倒下，本回合全队攻击 ×2`, "t"); }
}
function hit(b, src, tgt, dmg, L) {
  let trapPart = 0;
  const mine = b.traps.find(t => t.kind === "mine");
  if (mine) { b.traps.splice(b.traps.indexOf(mine), 1); dmg += 15; trapPart = 15; L(`地雷爆炸！${tgt.name} 额外受 15 伤害`, "t"); }
  const t = T(b, tgt);
  const absorbed = Math.min(t.shield, dmg); t.shield -= absorbed;
  const real = dmg - absorbed;
  const before = tgt.hp;
  tgt.hp -= real;
  L(`${src.name} → ${tgt.name}：${dmg} 伤害${absorbed ? `（护盾挡 ${absorbed}）` : ""}，剩 ${Math.max(0, tgt.hp)}`);
  if (tgt.side === "M") {
    if (tgt.hp <= 0) {
      tgt.dead = true; tgt.hp = 0; b.flags.lastKiller = src.uid;
      if (tgt.boss) b.flags.bossByTrap = trapPart > 0 && before - (real - trapPart) > 0;
      L(`${tgt.name} 被击倒`, "x");
    } else {
      const g = trapOn(b, "guillotine", tgt.uid);
      if (g && tgt.hp <= tgt.maxHp * 0.3) {
        b.traps.splice(b.traps.indexOf(g), 1); tgt.hp = 0; tgt.dead = true; b.flags.lastKiller = "trap";
        if (tgt.boss) b.flags.bossByTrap = true;
        L(`断头台落下！${tgt.name} 被处决`, "t");
      }
    }
  } else if (tgt.hp <= 0) heroDown(b, tgt, L);
}
function resolveRound(b, rng, L) {
  const esc = b.round >= CONFIG.escalateFrom ? Math.pow(2, b.round - CONFIG.escalateFrom + 1) : 1;
  if (esc > 1) L(`拖太久了：本回合伤害 ×${esc}`, "x");
  for (const h of aliveH(b)) {
    if (h.dead || checkEnd(b)) continue;
    const t = T(b, h);
    if (t.sleep) { L(`${h.name} 在打瞌睡`); continue; }
    if (h.act === "heal" && !t.holy) {
      const tg = aliveH(b).slice().sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0];
      const amt = Math.min(h.heal, tg.maxHp - tg.hp);
      tg.hp += amt; b.flags.priestActed = true;
      L(`${h.name} 给 ${tg.name} 回血 ${amt}，现在 ${tg.hp}`);
      continue;
    }
    let tg, dmg;
    if (h.act === "heal") { b.flags.priestActed = true; tg = aliveM(b)[0]; dmg = h.heal * 2 * esc; }
    else {
      const ms = aliveM(b);
      tg = h.act === "back" ? ms[ms.length - 1] : h.act === "lowest" ? ms.slice().sort((a, c) => a.hp - c.hp)[0] : ms[0];
      dmg = atkValue(b, h) * esc;
    }
    if (t.slip) {
      const team = aliveH(b).filter(x => x !== h);
      const adj = team.sort((a, c) => Math.abs(a.pos - h.pos) - Math.abs(c.pos - h.pos))[0];
      if (adj) { L(`${h.name} 手滑了！`, "t"); tg = adj; }
    }
    if (!tg || dmg <= 0) { if (dmg <= 0) L(`${h.name} 没造成伤害`); continue; }
    hit(b, h, tg, dmg, L);
    checkEnd(b);
  }
  for (const m of aliveM(b)) {
    if (m.dead || checkEnd(b)) continue;
    const t = T(b, m), it = b.intents[m.uid] || { kind: "attack", dmg: m.atk };
    if (t.sleep) { L(`${m.name} 在打瞌睡`); continue; }
    if (it.kind === "charge") { L(`${m.name} 正在蓄力……`); continue; }
    const taunter = b.taunt && unitById(b, b.taunt);
    const tg = taunter && !taunter.dead ? taunter : aliveH(b)[0];
    if (!tg) break;
    const tw = trapOn(b, "tripwire", tg.uid);
    if (tw) { b.traps.splice(b.traps.indexOf(tw), 1); L(`绊马索！${m.name} 摔倒了，这次攻击作废`, "t"); continue; }
    const dmg = Math.round(atkValue(b, m) * (it.kind === "smash" ? 2 : 1)) * esc;
    hit(b, m, tg, dmg, L);
    checkEnd(b);
  }
  b.temp = {}; b.taunt = null; b.lastGasp = false; b.martyrBoost = false;
  if (!b.winner) { b.round++; if (b.round > CONFIG.maxRounds) { b.winner = "M"; b.flags.endRound = b.round; L("超过回合上限，勇者判负", "x"); } }
}

// 庄家假想的"普通天神"：每回合 2～4 点，随机打强攻、守护、治愈
function bookieGod(b, r) {
  const g = CONFIG.bookieGod, hs = aliveH(b);
  if (!hs.length) return;
  const pts = pick(r, g.points);
  for (let i = 0; i < pts; i++) {
    const hurt = hs.filter(h => h.hp < h.maxHp * 0.7);
    const opts = ["atk", "shield"].concat(hurt.length ? ["heal"] : []);
    const k = pick(r, opts);
    if (k === "atk") { const h = hs.filter(x => x.act !== "heal").sort((a, c) => c.atk - a.atk)[0] || hs[0]; T(b, h).atkAdd += g.atk; }
    else if (k === "shield") T(b, hs[0]).shield += g.shield;
    else { const h = hurt.sort((a, c) => a.hp / a.maxHp - c.hp / c.maxHp)[0]; h.hp = Math.min(h.maxHp, h.hp + g.heal); }
  }
}
function cloneBattle(b) { const c = JSON.parse(JSON.stringify(b)); c.traps = []; c.log = []; return c; } // 庄家看不见陷阱
function simulate(b, n, r) {
  const out = [];
  const nolog = () => {};
  for (let i = 0; i < n; i++) {
    const c = cloneBattle(b);
    let guard = 0;
    while (!c.winner && guard++ < 40) { computeIntents(c); bookieGod(c, r); resolveRound(c, r, nolog); }

    const pr = heroes(c).find(h => h.act === "heal");

const prob = (sims, f, given = () => true) => { const g = sims.filter(given); return (g.filter(f).length + 0.5) / (g.length + 1); };

// 加码条款和剧本盘
const CONDS = {
  noDeath:    { name: "无人阵亡", test: s => !s.anyDeath, sides: ["win"] },
  fast3:      { name: "3 回合内结束", test: s => s.end <= 3, sides: ["win", "lose"] },
  fast4:      { name: "4 回合内结束", test: s => s.end <= 4, sides: ["win", "lose"] },
  priestIdle: { name: "牧师全场不出手", test: s => !s.priestActed, sides: ["win", "lose"], need: "priest" },
  bossTrap:   { name: "Boss 死于陷阱", test: s => s.bossTrap, sides: ["win"] },
};
const SCRIPTS = {
  priestLast: { name: "牧师打出最后一击", test: s => s.priestLast, need: "priest", modes: ["normal", "boss"] },
  exact3:     { name: "刚好第 3 回合结束", test: s => s.end === 3, modes: ["normal"] },
  exact4:     { name: "刚好第 4 回合结束", test: s => s.end === 4, modes: ["boss"] },
  narrow:     { name: "丝血险胜（勇者赢，且剩余生命合计 ≤ 15%）", test: s => s.narrow, modes: ["normal", "boss"] },
  martyrDie:  { name: "殉道者阵亡", test: s => s.martyrDied, need: "martyr", modes: ["normal"] },
  bossTrapS:  { name: "Boss 死于陷阱", test: s => s.bossTrap, modes: ["boss"] },
};
const condOK = (k, lineup) => !CONDS[k].need || lineup.includes(CONDS[k].need);

let S;
function newState(mode, seed) {
  seed = seed || Math.floor(Math.random() * 1e9);
  const prev = S && S.mode === mode ? S.lineup : null;
  S = { mode, seed, rng: mulberry32(seed), brng: mulberry32(seed ^ 0x9e3779b9), gold: CONFIG.startGold, goldStart: CONFIG.startGold,
    phase: "setup", lineup: prev || CONFIG.defaultLineup.slice(), b: null, quote: null,
    bet: { side: "win", amt: 0, parlay: null, scriptAmt: 0 }, script: null,
    live: null, liveUsed: false, liveOdds: null, liveP: null,
    points: 0, bought: 0, spentPoints: 0, spentRevive: 0, draw: [], discard: [], hand: [], sel: null, selStage: null, selHero: null,
    step: "start", settle: null, lastRound: null, afterChoice: {}, err: "" };
  render();
}
function buildDeck() { const d = []; for (const [id, n] of CONFIG.deck) for (let i = 0; i < n; i++) d.push(id); return shuffle(S.rng, d); }
function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (!S.draw.length) { if (!S.discard.length) return; S.draw = shuffle(S.rng, S.discard); S.discard = []; }

}
const L = (txt, cls) => S.b.log.push({ txt, cls });

function openBook() {
  const b = makeBattle(S.mode, S.lineup);
  const sims = simulate(b, CONFIG.bookieSims, S.brng);
  const pW = prob(sims, s => s.win);
  const pc = clamp(pW, CONFIG.pClamp[0], CONFIG.pClamp[1]);
  const conds = {};
  for (const k of Object.keys(CONDS)) {
    if (!condOK(k, S.lineup)) continue;
    if (k === "bossTrap" && S.mode !== "boss") continue;
    if (k === "fast3" && S.mode === "boss") continue;
    if (k === "fast4" && S.mode !== "boss") continue;
    conds[k] = {};
    for (const side of CONDS[k].sides) {
      const p = prob(sims, CONDS[k].test, s => s.win === (side === "win"));
      conds[k][side] = +clamp(CONFIG.parlay.R / p, CONFIG.parlay.min, CONFIG.parlay.max).toFixed(2);
    }
  }
  const sk = shuffle(S.rng, Object.keys(SCRIPTS).filter(k => SCRIPTS[k].modes.includes(S.mode) && (!SCRIPTS[k].need || S.lineup.includes(SCRIPTS[k].need))))[0];
  const ps = prob(sims, SCRIPTS[sk].test);
  S.script = { key: sk, name: SCRIPTS[sk].name, p: ps, odds: +clamp(CONFIG.script.R / ps, CONFIG.script.min, CONFIG.script.max).toFixed(2) };
  S.quote = { pW, pc, oddsWin: +(CONFIG.R / pc).toFixed(2), oddsLose: +(CONFIG.R / (1 - pc)).toFixed(2), conds };
  S.b = b; S.phase = "bet"; S.bet = { side: "win", amt: down10(C() / 2), parlay: null, scriptAmt: 0 };
}
function startFight() {
  const bt = S.bet, side = S.mode === "boss" ? "win" : bt.side;
  bt.side = side;
  const stake = bt.amt + bt.scriptAmt;
  if (bt.amt % 10 || bt.scriptAmt % 10 || bt.amt < 0 || bt.scriptAmt < 0) return err("押注要是 10 的倍数");
  if (bt.amt > C()) return err(`主盘最多 ${fmt(C())} G`);
  if (bt.scriptAmt > C() * CONFIG.script.cap) return err(`剧本盘最多 ${fmt(C() * CONFIG.script.cap)} G`);
  if (stake > S.gold) return err("金币不够");
  S.gold -= stake;
  bt.odds = side === "win" ? S.quote.oddsWin : S.quote.oddsLose;
  bt.mult = bt.parlay ? S.quote.conds[bt.parlay][side] : 1;
  S.draw = buildDeck(); S.discard = []; S.hand = [];
  S.phase = "battle"; S.err = "";
  L(`—— 开战 ——`, "r");

}
function err(m) { S.err = m; render(); return false; }
function liveEligible() { return S.bet.amt > 0 && !S.bet.parlay && !S.liveUsed; }
function beginRound() {
  const b = S.b;
  computeIntents(b);
  S.points = CONFIG.basePoints; S.bought = 0; S.sel = null; S.selStage = null;
  S.discard.push(...S.hand); S.hand = []; drawCards(CONFIG.handSize);
  L(`第 ${b.round} 回合`, "r");
  const deadNow = heroes(b).some(h => h.dead);
  if (liveEligible()) {
    const sims = simulate(b, CONFIG.liveSims, S.brng);
    const p = prob(sims, s => s.win);
    S.liveP = p;
    const ps = S.bet.side === "win" ? p : 1 - p;
    S.liveOdds = +clamp(CONFIG.live.R / ps, CONFIG.live.min, CONFIG.live.cap).toFixed(2);
  }
  S.step = (deadNow || liveEligible()) ? "start" : "play";
  if (S.step === "start" && !deadNow && !liveEligible()) S.step = "play";
}
function reviveInBattle(uid) {
  const h = unitById(S.b, uid), cost = Math.round(h.invest * CONFIG.revive.inBattle);
  if (S.gold < cost) return err("金币不够");
  S.gold -= cost; S.spentRevive += cost;
  h.dead = false; h.fake = false; h.hp = Math.round(h.maxHp * CONFIG.revive.inBattleHp);
  L(`花 ${fmt(cost)} G 原地复活 ${h.name}（${h.hp} 生命）`, "t");
  if (liveEligible()) { const sims = simulate(S.b, CONFIG.liveSims, S.brng); const p = prob(sims, s => s.win); S.liveP = p; const ps = S.bet.side === "win" ? p : 1 - p; S.liveOdds = +clamp(CONFIG.live.R / ps, CONFIG.live.min, CONFIG.live.cap).toFixed(2); }
  render();
}
function placeLive(amt) {
  if (amt % 10 || amt <= 0) return err("追加金额要是 10 的倍数");
  if (amt > S.bet.amt) return err("追加不能超过战前主盘");
  if (amt > S.gold) return err("金币不够");
  S.gold -= amt; S.live = { amt, odds: S.liveOdds }; S.liveUsed = true;
  L(`滚球追加：押勇者${S.bet.side === "win" ? "赢" : "输"} ${fmt(amt)} G，赔率 ${S.liveOdds}`, "t");
  S.step = "play"; S.err = ""; render();
}
const buyPrice = () => Math.round(CONFIG.buyBase * C() * Math.pow(2, S.bought));
function buyPoint() {
  if (S.bought >= CONFIG.maxBuy) return err("本回合最多加买 5 个");
  const p = buyPrice(); if (S.gold < p) return err("金币不够");
  S.gold -= p; S.spentPoints += p; S.bought++; S.points++; S.err = ""; render();
}
function validTarget(card, u) {
  const tg = CONFIG.cards[card].target;
  if (u.dead) return false;
  if (tg === "unit") return !u.boss;
  if (tg === "hero") return u.side === "H";
  if (tg === "monster") return u.side === "M" && !u.boss;
  if (tg === "trapMonster") return u.side === "M";
  if (tg === "priest") return u.side === "H" && u.act === "heal";
  if (tg === "heroThenMonster") return S.selStage === "monster" ? (u.side === "M" && !u.boss) : u.side === "H";

}
function clickCard(i) {
  const id = S.hand[i], cd = CONFIG.cards[id];
  if (cd.cost > S.points) return err("点数不够，可以加买");
  S.err = "";
  if (cd.target === "none") { applyCard(i, null); return; }
  S.sel = S.sel === i ? null : i; S.selStage = cd.target === "heroThenMonster" ? "hero" : null; render();
}

function applyCard(i, uid) {

  const t = u && T(b, u);
  switch (id) {
    case "strike": t.atkAdd += 6; L(`强攻 → ${u.name}：本回合攻击 +6`); break;
    case "guard": t.shield += 8; L(`守护 → ${u.name}：本回合护盾 +8`); break;
    case "mend": { const a = Math.min(10, u.maxHp - u.hp); u.hp += a; L(`治愈 → ${u.name}：回复 ${a}`); break; }
    case "oracle": drawCards(2); L(`神谕：抽 2 张`); break;

function finish() {
  const b = S.b, bt = S.bet, win = b.winner === "H";
  const lineupMax = heroes(b).reduce((a, h) => a + h.maxHp, 0), left = aliveH(b).reduce((a, h) => a + h.hp, 0);
  const pr = heroes(b).find(h => h.act === "heal");
  const res = { win, end: b.flags.endRound, anyDeath: b.flags.anyDeath, priestActed: b.flags.priestActed,
    priestLast: win && pr && b.flags.lastKiller === pr.uid, narrow: win && left <= lineupMax * 0.15,
    martyrDied: heroes(b).some(h => h.skill === "martyr" && h.dead), bossTrap: b.flags.bossByTrap };
  const mainHit = bt.amt > 0 && (bt.side === "win") === win && (!bt.parlay || CONDS[bt.parlay].test(res));
  let mainPay = mainHit ? Math.floor(bt.amt * bt.odds * bt.mult) : 0;

  S.phase = "end";

}

    <div class="row">
      <label class="opt ${side === "win" ? "on" : ""}"><input type="radio" name="side" data-a="side" data-v="win" ${side === "win" ? "checked" : ""}> 押勇者赢 <b>${q.oddsWin}</b> 倍 <span class="muted small">（公平 ${fair(q.pc)} 倍）</span></label>
      ${boss ? `<span class="muted">Boss 层庄家不开"押勇者输"</span>` : `<label class="opt ${side === "lose" ? "on" : ""}"><input type="radio" name="side" data-a="side" data-v="lose" ${side === "lose" ? "checked" : ""}> 押勇者输 <b>${q.oddsLose}</b> 倍 <span class="muted small">（公平 ${fair(1 - q.pc)} 倍）</span></label>`}
    </div>
    <div class="row">主盘金额 <input type="number" step="10" min="0" max="${C()}" value="${bt.amt}" data-a="amt"> <button data-a="amtq" data-v="0">0</button><button data-a="amtq" data-v="${down10(C() / 2)}">半注</button><button data-a="amtq" data-v="${C()}">满注 ${fmt(C())}</button></div>
    <h3>加码条款（可选；选了本场就不能滚球）</h3>
    <label class="opt ${!bt.parlay ? "on" : ""}"><input type="radio" name="pl" data-a="parlay" data-v="" ${!bt.parlay ? "checked" : ""}> 不加码（保留战中滚球）</label>
    ${condRows || `<p class="muted small">这一边没有可选的条款</p>`}
    <h3>剧本盘（独立，最多 ${fmt(C() * CONFIG.script.cap)} G）</h3>
    <p>本场剧本：「${S.script.name}」 <b>${S.script.odds}</b> 倍 <span class="muted small">（庄家估计概率 ${Math.round(S.script.p * 100)}%）</span></p>
    <div class="row">剧本金额 <input type="number" step="10" min="0" max="${C() * CONFIG.script.cap}" value="${bt.scriptAmt}" data-a="samt"> <button data-a="samtq" data-v="0">0</button><button data-a="samtq" data-v="${C() * CONFIG.script.cap}">满注</button></div>
    <div class="row"><button data-a="back">改阵容</button><button class="primary" data-a="fight">开战</button></div>
  </div>`;
}
function battleHTML() {
  const b = S.b;
  const sel = S.sel !== null ? S.hand[S.sel] : null;
  const hs = heroes(b).sort((a, c) => a.pos - c.pos), ms = monsters(b);
  const cl = u => sel !== null && validTarget(sel, u);
  let step = "";
  if (S.step === "start") {
    const dead = hs.filter(h => h.dead);
    step = `<div class="card"><h3>回合开始</h3>
      ${dead.length ? `<p>阵亡的勇者可以<b>原地复活</b>（投入的 ${CONFIG.revive.inBattle * 100}%，以 ${CONFIG.revive.inBattleHp * 100}% 生命回来）：</p><div class="row">${dead.map(h => `<button data-a="rev" data-id="${h.uid}">复活 ${h.name}（−${fmt(h.invest * CONFIG.revive.inBattle)} G）</button>`).join("")}</div>` : ""}
      ${liveEligible() ? `<p>滚球窗口：庄家按当前场面重估勇者胜率 <b>${Math.round(S.liveP * 100)}%</b>，追加押勇者${S.bet.side === "win" ? "赢" : "输"}的赔率 <b>${S.liveOdds}</b> 倍（封顶 ${CONFIG.live.cap}）。只能追加一次，最多 ${fmt(S.bet.amt)} G。</p>
        <div class="row">追加 <input type="number" step="10" min="10" max="${S.bet.amt}" value="${S.bet.amt}" id="liveamt"> <button data-a="live">追加滚球</button></div>` : ""}
      <div class="row"><button class="primary" data-a="toplay">${liveEligible() ? "不追加，" : ""}开始出牌</button></div></div>`;
  } else {
    step = `<div class="card"><div class="bar"><b>第 ${b.round} 回合 · 天神阶段</b><span class="sp"></span>
      点数 <b style="font-size:18px">${S.points}</b>　<button data-a="buy" ${S.bought >= CONFIG.maxBuy ? "disabled" : ""}>加买 1 点（−${fmt(buyPrice())} G）</button></div>
      ${sel ? `<p class="hint">选目标：${CONFIG.cards[sel].target === "heroThenMonster" ? (S.selStage === "hero" ? "先点一名勇者" : "再点一个怪物") : "点亮的单位都可以"}（再点一次手牌取消）</p>` : ""}
      <div class="hand">${S.hand.map((id, i) => { const c = CONFIG.cards[id]; return `<div class="fc ${S.sel === i ? "sel" : ""} ${c.cost > S.points ? "no" : ""} ${c.ty === "陷阱" ? "trap" : c.ty === "暗箱" ? "dark" : ""}" data-a="card" data-i="${i}"><span class="cost">${c.cost}</span><b>${c.name}</b><div class="ty">${c.ty}</div><div class="small">${c.desc}</div></div>`; }).join("")}</div>
      <div class="row"><button class="primary" data-a="end">结束出牌，开打</button><span class="muted small">抽牌堆 ${S.draw.length} · 弃牌堆 ${S.discard.length}</span></div></div>`;
  }
  const recap = S.lastRound && S.lastRound.length ? `<div class="card"><h3>上回合发生了什么</h3><div class="log" style="max-height:none">${S.lastRound.map(l => `<div class="${l.cls || ""}">${l.txt}</div>`).join("")}</div></div>` : "";
  return `${recap}<div class="card">${ticketHTML()}
    <h3>勇者</h3><div class="units">${hs.map(u => unitHTML(u, b, cl(u))).join("")}</div>
    <h3>敌人${S.mode === "boss" ? `　<span class="muted small">${TEXT.bossNote}</span>` : ""}</h3><div class="units">${ms.map(u => unitHTML(u, b, cl(u))).join("")}</div>
    ${b.traps.filter(t => !t.on).length ? `<p class="small" style="color:var(--dark)">场上：${b.traps.filter(t => !t.on).map(t => CONFIG.cards[t.kind].name).join("、")}</p>` : ""}
  </div>${step}<div class="card"><h3>战斗记录</h3><div class="log">${b.log.map(l => `<div class="${l.cls || ""}">${l.txt}</div>`).join("")}</div></div>`;
}
function endHTML() {
  const st = S.settle, bt = S.bet, b = S.b, res = st.res;
  const after = heroes(b).filter(h => h.dead);
  const afterCost = after.reduce((a, h) => a + (S.afterChoice[h.uid] === "revive" ? Math.round(h.invest * CONFIG.revive.after) : 0), 0);
  const stakes = bt.amt + bt.scriptAmt + (S.live ? S.live.amt : 0);
  const pays = st.mainPay + st.livePay + st.scriptPay;
  const betProfit = pays - stakes;
  const net = betProfit + st.bounty - st.toll - S.spentPoints - S.spentRevive - afterCost;
  const side = bt.side === "win" ? "赢" : "输";
  const row = (k, v, cls = "") => `<tr class="${cls}"><td>${k}</td><td class="n">${v}</td></tr>`;
  const lines = [];
  if (bt.amt) lines.push(row(`主盘：押勇者${side} ${fmt(bt.amt)} × ${bt.odds}${bt.parlay ? `，加码「${CONDS[bt.parlay].name}」×${bt.mult}（${CONDS[bt.parlay].test(res) ? "达成" : "没达成"}）` : ""}`, sgn(st.mainPay - bt.amt)));
  if (S.live) lines.push(row(`滚球：追加 ${fmt(S.live.amt)} × ${S.live.odds}`, sgn(st.livePay - S.live.amt)));
  if (bt.scriptAmt) lines.push(row(`剧本盘「${S.script.name}」${st.scriptHit ? "发生了" : "没发生"}`, sgn(st.scriptPay - bt.scriptAmt)));
  if (st.capped) lines.push(row(`（主盘 + 滚球派彩超过 ${CONFIG.payoutCap}C 上限，扣掉 ${fmt(st.capped)}）`, ""));
  return `<div class="card"><h3>${res.win ? `<span class="good">勇者胜</span>` : `<span class="bad">勇者败</span>`}（第 ${res.end} 回合结束）</h3>
    <h3>阵亡勇者怎么办</h3>
    ${after.length ? after.map(h => S.afterChoice[h.uid] === "free" ? `<p>${h.name}：${st.toll ? "已交 Boss 过路费，全队免费复活" : "假死机关，战后免费复活"}</p>` :
      `<div class="row"><b>${h.name}</b>（投入 ${h.invest}）
        <label><input type="radio" name="af${h.uid}" data-a="after" data-id="${h.uid}" data-v="revive" ${S.afterChoice[h.uid] === "revive" ? "checked" : ""}> 战后复活 −${fmt(h.invest * CONFIG.revive.after)} G</label>
        <label><input type="radio" name="af${h.uid}" data-a="after" data-id="${h.uid}" data-v="abandon" ${S.afterChoice[h.uid] === "abandon" ? "checked" : ""}> 放弃（永久失去）</label></div>`).join("") : `<p class="muted">没有人阵亡。</p>`}
    <h3>这一场的账</h3>
    <table class="st">
      ${lines.join("")}
      ${row("<b>押注赚了</b>", `<b>${sgn(betProfit)}</b>`)}
      ${st.bounty ? row("过关赏金", sgn(st.bounty)) : ""}
      ${st.toll ? row(`Boss 过路费（${CONFIG.bossToll}C，交了算过关）`, sgn(-st.toll)) : ""}
      ${row("买点数花了", sgn(-S.spentPoints))}
      ${row("原地复活花了", sgn(-S.spentRevive))}
      ${row("战后复活花了", sgn(-afterCost))}
      ${row("实际净赚", sgn(net), "tot")}
    </table>
    <p class="muted small">押注赚了 ${sgn(betProfit)}${st.bounty ? ` + 赏金 ${fmt(st.bounty)}` : ""}${st.toll ? ` − 过路费 ${fmt(st.toll)}` : ""} − 买点数 ${fmt(S.spentPoints)} − 复活费 ${fmt(S.spentRevive + afterCost)} = ${sgn(net)} G。
      金币：开场 ${fmt(S.goldStart)} → 结算后 ${fmt(S.gold - afterCost)}（差 ${sgn(S.gold - afterCost - S.goldStart)}）</p>
    <div class="row"><button class="primary" data-a="again">再来一场（金币重置为 ${fmt(CONFIG.startGold)}）</button></div>
  </div><div class="card"><h3>战斗记录</h3><div class="log">${b.log.map(l => `<div class="${l.cls || ""}">${l.txt}</div>`).join("")}</div></div>`;
}

// =====================================================================
// 事件
// =====================================================================
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if (a === "mode") return newState(v);
  if (a === "restart" || a === "again") return newState(S.mode);
  if (a === "rehand") { S.discard.push(...S.hand); S.hand = []; drawCards(CONFIG.handSize); S.sel = null; return render(); }
  if (a === "lock") { if (new Set(S.lineup).size < 3) return err("3 个位置要选不同的勇者"); S.err = ""; openBook(); return render(); }
  if (a === "side") { S.bet.side = v; S.bet.parlay = null; return render(); }
  if (a === "parlay") { S.bet.parlay = v || null; return render(); }
  if (a === "amtq") { S.bet.amt = Number(v); return render(); }
  if (a === "samtq") { S.bet.scriptAmt = Number(v); return render(); }
  if (a === "back") { S.phase = "setup"; return render(); }
  if (a === "fight") { if (startFight() !== false) render(); return; }
  if (a === "rev") return reviveInBattle(el.dataset.id);
  if (a === "live") return placeLive(Number(document.getElementById("liveamt").value) || 0);
  if (a === "toplay") { S.step = "play"; S.err = ""; return render(); }
  if (a === "buy") return buyPoint();
  if (a === "card") return clickCard(Number(el.dataset.i));
  if (a === "unit") return clickUnit(el.dataset.id);
  if (a === "end") return endTurn();
  if (a === "after") { S.afterChoice[el.dataset.id] = v; return render(); }
});
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.a;
  if (a === "pos") { const i = Number(el.dataset.i), id = el.value, j = S.lineup.indexOf(id); if (j >= 0 && j !== i) S.lineup[j] = S.lineup[i]; S.lineup[i] = id; render(); }
  if (a === "amt") { S.bet.amt = Math.max(0, Number(el.value) || 0); render(); }
  if (a === "samt") { S.bet.scriptAmt = Math.max(0, Number(el.value) || 0); render(); }
});
document.title = TEXT.title;
newState("normal");
</script>
</body>
</html>
