<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>魔塔操盘手 v0.8.3</title>
<style>
:root { --bg:#f6f5f1; --card:#fff; --ink:#1f1f1f; --muted:#6b6b6b; --line:#e2e0da; --accent:#2f6fde; --good:#1e8a4a; --bad:#c0392b; --gold:#a8730a; --dark:#6a3fb5; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
.wrap { max-width:980px; margin:0 auto; padding:12px; }
h1 { font-size:20px; margin:4px 0 2px; } h3 { font-size:15px; margin:10px 0 6px; } p { margin:6px 0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
.bar { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; } .bar .sp { flex:1; }
.top { position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.06); }
.wrapbtn { display:flex; flex-wrap:wrap; gap:4px; } .wrapbtn button { padding:3px 8px; font-size:12px; }
button { font:inherit; padding:6px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink); }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
button.on { background:#1f1f1f; color:#fff; border-color:#1f1f1f; }
button:disabled { opacity:.45; cursor:not-allowed; } button.small { padding:3px 8px; }
.muted { color:var(--muted); } .small { font-size:12px; } .good { color:var(--good); } .bad { color:var(--bad); } .gold { color:var(--gold); font-weight:700; }
.err { font-weight:700; }
.units { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
.unit { border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:#fcfcfa; position:relative; transition:transform .15s; }
.unit.dead { opacity:.45; } .unit.boss { border-color:#b03030; background:#fff6f6; }
.unit.tgt { outline:3px solid var(--accent); cursor:pointer; background:#eef3fd; }
.unit.tgt2 { cursor:pointer; } .unit.picked { outline:3px solid var(--good); background:#eefaf2; }
.unit.acting { transform:translateY(-8px) scale(1.03); box-shadow:0 0 0 3px #f0b429; z-index:2; }
.unit.hit { animation:shake .35s; box-shadow:0 0 0 3px #e06a5a; } .unit.healed { box-shadow:0 0 0 3px #4cb876; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
.pop { position:absolute; top:2px; right:4px; background:rgba(255,255,255,.88); border-radius:6px; padding:0 4px; font-weight:800; font-size:18px; color:var(--bad); animation:rise .9s forwards; pointer-events:none; white-space:nowrap; z-index:3; }
.pop.heal { color:var(--good); } .pop.crit { color:#d35400; font-size:22px; } .pop.graze { color:#888; } .pop.info { color:var(--dark); font-size:14px; } .pop.dead { color:#000; }
@keyframes rise { 0%{opacity:0; transform:translateY(8px)} 20%{opacity:1} 100%{opacity:1; transform:translateY(-10px)} }
.nm { font-weight:700; } .lv { font-size:11px; background:#1f1f1f; color:#fff; border-radius:8px; padding:0 6px; font-weight:400; }
.badge { position:absolute; top:-8px; right:6px; background:var(--good); color:#fff; font-size:11px; border-radius:8px; padding:0 6px; }
.hp { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:3px 0; } .hp > div { height:100%; background:var(--good); transition:width .3s; } .unit.M .hp > div { background:#c0392b; }
.tags span { display:inline-block; font-size:11px; padding:0 6px; border-radius:10px; background:#f0efeb; margin:2px 2px 0 0; }
.tags .trap { background:#efe4fb; color:var(--dark); } .tags .buff { background:#e3f3e8; color:var(--good); } .tags .debuff { background:#fbe5e2; color:var(--bad); }
.intent { font-size:12px; color:#8a1f1f; margin-top:2px; } .intent b { font-size:13px; }
.pv { font-size:12px; color:var(--accent); font-weight:700; margin-top:2px; }
.order { display:flex; flex-wrap:wrap; gap:4px; align-items:center; font-size:12px; margin:6px 0; }
.order span { padding:1px 8px; border-radius:10px; background:#f0efeb; } .order span.muted { background:none; padding:0; } .order span.now { background:#f0b429; color:#000; font-weight:700; } .order i { color:#bbb; font-style:normal; }
.banner { position:fixed; left:50%; top:38%; transform:translate(-50%,-50%); background:rgba(20,20,20,.88); color:#fff; font-size:24px; font-weight:800; padding:12px 26px; border-radius:12px; z-index:60; animation:bn .9s forwards; pointer-events:none; text-align:center; max-width:90vw; }
@keyframes bn { 0%{opacity:0; transform:translate(-50%,-50%) scale(.8)} 15%{opacity:1; transform:translate(-50%,-50%) scale(1.05)} 80%{opacity:1} 100%{opacity:0} }
.hand { display:flex; flex-wrap:wrap; gap:8px; }
.fc { width:160px; border:2px solid var(--line); border-radius:10px; padding:6px 8px; background:#fff; }
.hand > .fc[data-a] { cursor:pointer; } .fc.sel { border-color:var(--accent); background:#eef3fd; } .fc.no { opacity:.6; }
.fc .cost { float:right; font-weight:700; background:#1f1f1f; color:#fff; border-radius:50%; width:22px; height:22px; text-align:center; line-height:22px; font-size:12px; }
.fc .ty { font-size:11px; color:var(--muted); } .fc.trap { border-color:#c9b2ee; } .fc.dark { border-color:#e3a59d; } .fc.black { border-color:#555; } .fc.star { border-color:#e2c35a; } .fc.hero { border-color:#8fc49f; }
.rar-rare { color:#1d5fd1; } .rar-legend { color:#c2620a; }
.kw { display:inline-block; font-size:11px; background:#1f1f1f; color:#fff; border-radius:8px; padding:0 6px; margin-right:4px; }
.pts { font-size:18px; }
.ticket { background:#fffdf3; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; }
.log { max-height:240px; overflow:auto; font-size:12px; background:#fbfaf7; border:1px solid var(--line); border-radius:8px; padding:6px 8px; }
.log div { padding:1px 0; border-bottom:1px dotted #eee; } .log .r { font-weight:700; color:var(--accent); border:none; margin-top:4px; } .log .t { color:var(--dark); } .log .x { color:var(--bad); }
table.st { border-collapse:collapse; width:100%; max-width:560px; } table.st td { padding:4px 8px; border-bottom:1px solid var(--line); } table.st td.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.st tr.tot td { border-top:2px solid var(--ink); font-weight:700; font-size:15px; }
.row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:6px 0; }
input[type=number] { width:100px; padding:5px; font:inherit; } textarea { width:100%; font:12px monospace; }
.opt { display:block; padding:5px 8px; border:1px solid var(--line); border-radius:8px; margin:4px 0; cursor:pointer; } .opt.on { border-color:var(--accent); background:#eef3fd; } .opt.closed { background:#f3f2ee; color:var(--muted); cursor:default; }
.hint { background:#fff8e1; border:1px solid #f0d98a; border-radius:8px; padding:6px 10px; font-size:13px; margin:6px 0; } .warn { color:#9a5b00; font-size:12px; }
details summary { cursor:pointer; font-weight:700; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; }
.modal { position:fixed; left:50%; top:5vh; transform:translateX(-50%); width:min(900px,94vw); max-height:88vh; overflow:auto; background:#fff; border-radius:12px; padding:12px 14px; z-index:50; }
.modal .x { float:right; }
@media (max-width:640px) { .wrap { padding:8px; } .fc { width:calc(50% - 4px); } .units { grid-template-columns:repeat(3,1fr); gap:6px; } .unit { padding:5px; font-size:12px; } .banner { font-size:19px; } .top { font-size:12px; } }

.fin.on { border-color:var(--accent); background:#eef3fd; }

.slotbox { text-align:center; border:2px solid #e2c35a; } .slotbox h3 { text-align:left; }
.reels { display:flex; justify-content:center; gap:10px; margin:10px 0; }
.reel { width:64px; height:72px; line-height:72px; font-size:34px; font-weight:800; background:#1f1f1f; color:#ffd766; border-radius:10px; animation:reelin .5s ease-out; }
.reel:nth-child(2) { animation-duration:.8s; } .reel:nth-child(3) { animation-duration:1.1s; } .reel.wide { width:150px; }
.slotbox.seven .reel, .slotbox.coin .reel { background:#b3261e; color:#fff; } .slotbox.pair .reel { background:#3b5bdb; color:#fff; }
button.big { font-size:18px; padding:10px 34px; }
@keyframes reelin { 0%{transform:translateY(-40px) rotateX(90deg); opacity:0} 60%{transform:translateY(6px)} 100%{transform:none; opacity:1} }
.slotbox .row { justify-content:center; }
.fc.pass { border-color:#b3261e; background:#fff8e6; } .legend { color:#b3261e; }
.fc.revive { border-color:#2f9e44; background:#f1fbf3; }
.ledger td.barc { width:40%; } .bar { display:inline-block; height:10px; border-radius:3px; } .bar.in { background:#2f9e44; } .bar.out { background:#c92a2a; }
.curve { width:100%; max-width:480px; height:auto; background:#fafafa; border:1px solid var(--line); border-radius:6px; }

</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>
// =====================================================================
// 配置区：所有数值、名字、文字、图片路径都在这个文件里改
// =====================================================================
const CONFIG = {
  version: "0.8.3",
  floors: 50, bossEvery: 5,
  startGold: 300, startHeroes: ["shield", "sword", "priest"], teamMax: 6, fieldMax: 3, blackSlots: 5, deckMin: 6,
  startDeck: [["strike", 4], ["guard", 3], ["mend", 2], ["oracle", 1]],
  capBase: 100, capGrow: 1.124,                 // 押注上限 C(f) = 100 × 1.124^(f−1)（以前叫"限红"）
  stages: [                                     // 每一段：庄家返还率 R、普通层赏金、普通层过路费 toll、Boss 过路费 bossToll（都 ×C）、弱怪层比例 weak
    { to: 5, R: 1.05, bounty: 0.5, toll: 0.5, bossToll: 3, name: "新手期" }, { to: 25, R: 1.0, bounty: 0.4, toll: 0.5, bossToll: 3, weak: 0.4, name: "上半场" },
    { to: 35, R: 0.92, bounty: 0.3, name: "中期" }, { to: 50, R: 0.90, bounty: 0.3, name: "后期" } ],   // 没写 toll / bossToll / weak 的段用下面的默认值
  bossBounty: 1.5, bossToll: 5,
  // 第 50 层三个结局。fix=世纪假赛：倍率 = 1 ÷ 庄家眼里勇者（没人帮）输的概率，最高 maxOdds；输的概率 ≥ 95% 不接单；至少押手上金币的 minStake
  // duel=堂堂正正：魔王按全队最强 3 人调到庄家估计胜率 duelTarget，且不低于标准魔王的 duelFloor 倍。tower=买下魔塔：价格 towerPrice×C
  // 第 50 层老虎机定结局：slot=三个结局的权重（运气抬高对决和收购）；重摇 respin×C，每次翻倍；堂堂正正（普通版）随时可选
  // 摇到堂堂正正 = 加强版：魔王调到胜率 duelPlus.target，赢了金币 ×duelPlus.mult；输过一次以后只能打普通版
  // 收购魔塔：身家到 towerMin×C 才买得起，价格 = 身家 × towerPct，剩下的带走
  finale: { maxOdds: 10, minStake: 0.1, duelTarget: 0.5, duelFloor: 0.3, slot: { fix: 55, duel: 35, tower: 10 }, duelPlus: { target: 0.35, mult: 2 }, respin: 2, respinGrow: 2, towerMin: 200, towerPct: 0.99 },
  // 第 25 层三选一
  // path2 大押注：押注上限、派彩上限、剧本盘 ×capMul，过路费 ×tollMul；只在 floors 这几层能撤离，老虎机用 tiers / weights
  fork: { floor: 25,
    // path1 亡命徒：死了不复活，没有过路费
    //   资金池 = pool×C(25)×poolGrow^(层数−25)×(heatBase+热度÷100)×(1+怒气×anger.pool÷100)
    //   怒气：押中净赚每 1 个押注上限 +anger.perC（最高 max）；没押中或不押减半。押中后净赚多拿 怒气×anger.bonus %；怪物生命攻击 ×(1+anger.monster×怒气÷100)
    //   复活卡：商店每次必有 1 张，价格取 revive.price×C 和身家×revive.pct 里高的；最多带 revive.max 张。战斗中原地复活：inBattle.c×C 和身家×inBattle.pct 里高的
    //   商店每 shopEvery 层开一次（第 25、50 层也开），每次 heroSlots 个勇者格。撤离只能靠商店里的通行证（权重 passW、档位 passTiers、权重 passWeights）
    // R：亡命徒路线庄家的返还率（1.0 = 不抽水）
    path1: { pool: 30, poolGrow: 1.2, heatBase: 0.5, house: 1.5, R: 1.0,
      anger: { perC: 10, max: 100, pool: 2, bonus: 1, monster: 0.4 },
      revive: { price: 1, pct: 0.02, max: 3 }, p1Slot: true,   // p1Slot：商店多 1 格"亡命徒专柜"，必出 1 张专属牌
      // 亡命徒专属牌和三张旧牌在路一的新效果
      cards: { bountyKill: 0.5, bountyBoss: 3, spotlightHeat: 70, spotlightAnger: 2, spotlightMonster: 0.5, encoreHeat: 15, encoreAnger: 10, borrowPer: 25, veteranFloors: 5, veteranMul: 1.3, monkRise: 0.5, cometAnger: 20 }, inBattle: { c: 1, pct: 0.05 }, shopEvery: 2, heroSlots: 2,
      passW: 1.1, passTiers: [0.3, 0.5, 0.75, 1, 2], passWeights: [45, 30, 14, 10, 1] },
    path2: { capMul: 2.5, tollMul: 1.5, floors: [35, 45], tiers: [0.3, 0.5, 0.75, 1, 1.5], weights: [35, 30, 20, 12, 3] } },
  // 玩家第一次到第 2 层时的固定教学怪阵（数值就是最终面板，不再乘倍率）
  tutorial2: { name: "前排送死", tip: "勇者先出手。前排小骷髅只有 8 点生命。", monsters: [["小骷髅", 8, 5], ["弩手", 65, 23]] },
  // 撤离老虎机：打赢 Boss 后先摇带出率，再决定走不走。tiers=带出率，weights=各档权重（运气把最低档以外的权重抬高）
  extractSlot: { tiers: [0.3, 0.5, 0.75, 1], weights: [40, 30, 20, 10] },
  // 押中老虎机：主盘押到押注上限的 minStake 以上并且押中，摇一次。mult=主盘赚到的钱变成几倍（多出来的部分另算，不占派彩上限）
  slot: { minStake: 0.5, prizes: [{ key: "seven", p: 0.01, mult: 5 }, { key: "coin", p: 0.04, mult: 2 }, { key: "pair", p: 0.15, mult: 1.2 }] },
  // 运气值：每 1 点让各奖项概率 ×(1+perPoint)。没中奖 +missGain；中三个金币或三个 7 后清零（黑幕牌给的不清）。pityAfter：否极泰来要连输几次主盘
  fortune: { perPoint: 0.10, max: 20, missGain: 1, koi: 5, dice: 10, pityAfter: 3 },
  basePoints: 3, handSize: 5, buyBase: 0.1, maxBuy: 5,
  pClamp: [0.15, 0.95],                         // 胜率 ≥ 95% 的那一边"稳局不开盘"
  live: { R: 0.85, cap: 3.0, capLeak: 3.5 },
  payoutCap: 4, payoutCapHouse: 6,              // 主盘 + 滚球派彩合计上限（×C）
  parlay: { R: 0.7, min: 1.3, max: 2.0, maxParlayer: 2.5, offer: 3 },
  script: { R: 0.8, min: 1.5, max: 6, cap: 0.25, rerollBase: 0.1, writer: 1, bard: 0.5 },
  // 复活：赢了全员免费复活；普通层输了交过路费 normalToll×C（不交则这场阵亡的勇者永久失去）；战斗中原地复活每人 inBattle×C
  revive: { inBattle: 1.0, inBattleHp: 0.5, normalToll: 1.0, tollMonk: 0.5, tollFake: 0.5, tollComet: 0.25 },
  luck: { crit: 0.10, critMul: 2, graze: 0.10, grazeMul: 0.5 },
  trapperBonus: 1.5, guillotinePct: 0.3, traitorPct: 0.2, bardBuff: 4, miserGold: 0.05,
  bossAoe: 0.6, bossShield: 0.12,
  escalateFrom: 8, maxRounds: 15,
  heat: { start: 50, min: 10, max: 95, win: 5, lose: -35, hype: 10, show: 10, bias: 0.004, gamblerAt: 70 }, // bias：热度每高 1 点，庄家把勇者数值高估 0.4%
  bookieSims: 300, liveSims: 200,
  bookieGod: { points: [2, 3, 3, 4], atk: 6, shield: 8, heal: 10 },   // 数值同样随层数放大
  anim: { stepMs: 600 },
  // 怪物强度：倍率 K(f) 从 m1 起，每层乘 growth；弱怪层 = 基准数值，强怪层 = 生命 ×(1+tierHp)、攻击 ×(1+tierAtk)
  monster: { m1: 1.0, growth: [{ to: 5, g: 1.08 }, { to: 10, g: 1.10 }, { to: 20, g: 1.12 }, { to: 35, g: 1.145 }, { to: 50, g: 1.165 }],
    weakRate: 0.3, tutorialT: [0.5, 0.6, 0.68, 0.75], tierHp: 0.4, tierAtk: 1.0, bossScale: 1.2 },
  // 养成：勇者每升 1 级，生命/攻击/治疗 ×mult；每级 cost×C；等级上限 = 当前层数。命运牌的固定数值按"层数等级"同样放大
  level: { mult: 1.12, cost: 0.05 },
  // 商店：slots 个格子从同一个大卡池里抽，typeW=各类牌的权重；刷新价 refresh×C，每刷一次翻倍，每次进店重置
  // 勇者不在大卡池里，货架上另有 1 个固定的勇者格
  shop: { slots: 5, typeW: { fate: 46, star: 28, black: 26 }, heroRarity: { basic: 40, common: 30, rare: 24, legend: 6 },
    del: 0.5, refresh: 0.2, refreshGrow: 2, rarity: { common: 65, rare: 28, legend: 7 },
    price: { fate: { basic: 0.3, common: 0.5, rare: 1, legend: 2 }, black: { common: 1, rare: 2, legend: 3 },
      star: { common: 0.5, rare: 1.2, legend: 2.5 }, hero: { basic: 1, common: 1.5, rare: 2.5, legend: 4 } } },
  blackEffects: { cousin: 0.5, insurer: 0.2, fixer: 0.2, stash: 0.1, lifeins: 0.15, bitter: 0.1, gate: 0.02, comeback: 0.10 },
  hallMax: 12,
};

// act：front=打最前面的敌人 back=打最后面的 lowest=打血最少的 heal=给血最少的队友回血 bard=不攻击
const HEROES = {
  shield:  { name: "盾卫", rarity: "basic", hp: 60, atk: 4, act: "front", img: "" },
  sword:   { name: "剑士", rarity: "basic", hp: 45, atk: 8, act: "front", img: "" },
  rogue:   { name: "刺客", rarity: "basic", hp: 30, atk: 10, act: "back", img: "" },
  mage:    { name: "法师", rarity: "basic", hp: 28, atk: 7, act: "lowest", img: "" },
  priest:  { name: "牧师", rarity: "basic", hp: 32, atk: 0, heal: 12, act: "heal", img: "" },
  gambler: { name: "赌徒", rarity: "common", hp: 40, atk: 8, act: "front", skill: "gambler", kw: "热度", desc: "每次攻击随机 1～16；热度 ≥ 70 时最低 8", img: "" },
  miser:   { name: "守财奴", rarity: "common", hp: 38, atk: 3, act: "front", skill: "miser", kw: "金币", desc: "他活着在场时，每回合给你 0.05C 金币", img: "" },
  trapper: { name: "陷阱师", rarity: "common", hp: 35, atk: 5, act: "front", skill: "trapper", kw: "陷阱", desc: "每场开始免费埋 1 个陷阱（绊马索或地雷）；他活着时你的地雷、荆棘伤害 +50%", img: "" },
  monk:    { name: "不死僧", rarity: "rare", hp: 40, atk: 6, act: "front", skill: "monk", kw: "复活", desc: "他上阵的场次，普通层输了的过路费减半；亡命徒路线里：他上阵的场次，阵亡的队友有一半机会自己爬起来，不用复活卡", img: "" },

function rollRarity(r, w) { const tot = Object.values(w).reduce((a, x) => a + x, 0); let x = r() * tot; for (const k of Object.keys(w)) { x -= w[k]; if (x < 0) return k; } return Object.keys(w)[0]; }

  for (let guard = 0; out.length < n && guard < 200; guard++) {

const p1Only = d => d && d.p1 && G.path !== 1;   // 亡命徒专属牌只在路一出现

  const sc = CONFIG.shop, items = [], taken = (type, key) => items.some(x => x.type === type && x.key === key);

    const type = rollRarity(grand, tw); let k;

    if (type === "fate") k = rollFrom(CARDS, 1, grand, sc.rarity, key => taken(type, key) || p1Only(CARDS[key]))[0];
    else if (type === "black") k = rollFrom(BLACKS, 1, grand, sc.rarity, key => taken(type, key) || has(key) || p1Only(BLACKS[key]))[0];
    else k = rollFrom(STARS, 1, grand, sc.rarity, key => taken(type, key))[0];

  const hn = G.path === 1 ? P1().heroSlots : 1, hks = rollFrom(HEROES, hn, grand, sc.heroRarity, key => G.team.some(m => m.key === key));
  for (const hk of hks) items.push({ type: "hero", key: hk, sold: false });
  if (G.path === 1) items.push({ type: "revive", key: "revive", sold: false });   // 路一：每次进店必有 1 张复活卡
  if (G.path === 1 && P1().p1Slot) {   // 路一：亡命徒专柜，每次进店必有 1 张专属牌
    const pool = [...Object.keys(CARDS).filter(k => CARDS[k].p1).map(k => ["fate", k]), ...Object.keys(BLACKS).filter(k => BLACKS[k].p1 && !has(k)).map(k => ["black", k])].filter(([t, k]) => !taken(t, k));
    if (pool.length) { const [t, k] = pool[Math.floor(grand() * pool.length)]; items.push({ type: t, key: k, sold: false, p1slot: true }); }
  }

}
function revealPass(i) { const it = G.shop && G.shop.items[i]; if (!it || it.type !== "pass" || it.sold) return { ok: false, err: "没有通行证" }; it.revealed = true; autosave(); return { ok: true, rate: it.rate }; }
function usePass(i) {   // 当场撤离；不用的话，离开商店或刷新货架它就没了

}
const priceMul = (type, key) => { if (type === "pass") return 0; const d = { fate: CARDS, black: BLACKS, star: STARS, hero: HEROES }[type][key]; return key === "pluto" ? 0 : d.price || CONFIG.shop.price[type][d.rarity]; };

    case "venus": m.hpAdd += 15; m.atkAdd -= 2; break; case "saturn": m.atkAdd += 5; m.hpAdd -= 8; break;
    case "comet": m.atkAdd += 6; m.comet = (m.comet || 0) + 1; break; case "polaris": m.hpAdd += 20; break;

function buyItem(i, memberId) {
  const it = G.shop.items[i]; if (!it || it.sold) return { ok: false, err: "卖掉了" };

function sellBlack(i) { const bk = G.blacks[i]; if (!bk) return { ok: false }; book("perks", Math.round(bk.paid / 2)); G.blacks.splice(i, 1); autosave(); return { ok: true }; }

function shownAtk(b, u) { const t = TT(b, u); return Math.max(0, Math.round((u.atk + t.atkAdd) * t.atkMul)); }

    case "weaken": return noAtk ? "他不攻击，没效果" : `攻击 ${fmt(a)} → ${fmt(Math.round(a / 2))}`;
    case "coin": return noAtk ? "他不攻击，没效果" : `攻击 ${fmt(a * 2)} 或 ${fmt(Math.round(a / 2))}`;
    case "guard": case "bigshield": return `护盾 ${fmt(t.shield)} → ${fmt(t.shield + n)}`;
    case "mend": return `生命 ${fmt(u.hp)} → ${fmt(Math.min(u.maxHp, u.hp + n))}`;

    case "slip": { if (u.act === "heal") return TT(b, u).holy ? "圣愚 + 手滑 = ？？？" : "会把血奶给怪物"; if (u.act === "bard") return "会给怪物伴奏"; const al = adjacentAlly(b, u); return al ? `会砍到 ${al.name}` : "身边没有队友"; }
    case "soulswap": return U.stage ? `生命 ${fmt(u.hp)} ⇄ ${fmt(unitById(b, U.first).hp)}` : `交出生命 ${fmt(u.hp)}`;
    case "swap": return U.stage ? `和 ${unitById(b, U.first).name} 换位` : `现在 ${u.pos + 1} 号位`;
    case "rewrite": return U.stage ? `让 ${unitById(b, U.first).name} 打它` : `攻击 ${fmt(a)}，由你指定打谁`;
    case "tripwire": return "下一个打他的敌人摔倒";

    case "guillotine": return `生命 ≤ ${fmt(Math.floor(u.maxHp * CONFIG.guillotinePct))} 时处决（现在 ${fmt(u.hp)}）`;
    case "thorns": return "下次挨打原样反弹";
    case "fakedeath": return "他阵亡后这场若输，过路费少 0.5C";
    case "holyfool": return TT(b, u).slip ? "圣愚 + 手滑 = ？？？" : `改为攻击，伤害 ${fmt(u.heal * 2)}`;
    case "taunt": return "本回合敌人都打他";
    case "vamp": return "伤害的一半转为回血";

function intentText(b, m, plan) {

    case "back": G.phase = "prep"; Q = null; return render();
    case "fight": U.slotPulled = false; resetSel(); return act(startBattle());
    case "rev": return act(reviveInBattle(id));
    case "live": return act(placeLive(Number(document.getElementById("liveamt").value) || 0));
    case "toplay": BT.step = "play"; U.err = ""; return render();
    case "buy": return act(buyPoint());
    case "buyplay": { const o = U.offer; if (!o) return; if (G.gold < o.price) { U.err = "金币不够"; return render(); } for (let j = 0; j < o.k; j++) buyPoint(); U.offer = null; return clickCard(o.i); }
    case "nobuy": U.offer = null; return render();
    case "card": return clickCard(i);
    case "unit": return clickUnit(id);
    case "end": uiEndTurn(); return;
    case "toll": return act(setToll(v));
    case "save": return act(toggleSave(v));
    case "confirm": U.slotPulled = false; confirmSettle(); U.err = ""; window.scrollTo(0, 0); return render();
    case "extract": decideExtract(true); return render();
    case "stay": decideExtract(false); return render();
    case "reward": pickReward(i >= 0 ? i : null); return render();
    case "shopBuy": { const it = G.shop.items[i]; if (it && it.type === "star" && !STARS[it.key].team) { U.starPick = i; return render(); } return act(buyItem(i)); }
    case "starTo": { const r = buyItem(U.starPick, Number(id)); if (r.ok) U.starPick = null; return act(r); }
    case "fork": return act(chooseFork(Number(v)));
    case "passReveal": return act(revealPass(i));
    case "passUse": { const r = usePass(i); U.starPick = null; if (r.ok) { U.err = ""; window.scrollTo(0, 0); return render(); } return act(r); }
    case "finaleSpin": return act(spinFinale());
    case "slotPull": U.slotPulled = true; return render();
    case "spinExtract": spinExtract(); return render();
    case "starCancel": U.starPick = null; return render();
    case "refresh": U.starPick = null; return act(refreshShop());
    case "del": return act(deleteCard(G.deck.indexOf(v)));
    case "sell": return act(sellBlack(i));
    case "leave": U.starPick = null; leaveShop(); U.err = ""; window.scrollTo(0, 0); return render();
    case "finale": if (!v) { G.finale = null; G.duelPlus = false; G.foe = floorFoe(G.floor); Q = null; return render(); } return act(chooseFinale(v));
    case "hall": U.hallPick = v === "" ? null : Number(v); return render();
  }
});
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset && el.dataset.a;
  if (a === "amt") { G.bet.amt = Math.max(0, Number(el.value) || 0); render(); }
  if (a === "samt") { G.bet.scriptAmt = Math.max(0, Number(el.value) || 0); render(); }
});
document.title = TEXT.title;
render();

</script>
</body>
</html>
